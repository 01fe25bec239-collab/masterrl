      - engine
      - version
      - algorithm
      - display_name
      - maturity
      - runnable
      - update_strategies
      - precision
      - enabled_hardware
      - problems
      properties:
        algorithm:
          type: string
          description: Method id.
        display_name:
          type: string
          description: Shown in the app.
        enabled_hardware:
          type: array
          items:
            type: string
          description: Hardware classes where the engine passed its probe.
        engine:
          type: string
          description: Engine name.
        maturity:
          type: string
          description: stable, beta or experimental.
        precision:
          type: array
          items:
            type: string
          description: Precisions it offers.
        problems:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityProblem'
