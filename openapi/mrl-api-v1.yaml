        hint:
          type: string
          description: What to do.
        message:
          type: string
          description: What is wrong.
        path:
          type:
          - string
          - 'null'
          description: What it concerns, like `/resources`.
    CapabilityReport:
      type: object
      description: '`GET /capabilities`.'
