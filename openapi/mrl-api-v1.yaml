              schema:
                $ref: '#/components/schemas/Readiness'
components:
  schemas:
    AlertPage:
      type: object
      description: A page of alerts (OpenAPI name).
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertView'
          description: Alerts.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; null on the last page.
    AlertView:
      type: object
      description: One alert.
      required:
      - id
      - scope_kind
      - source
      - code
      - severity
      - title
      - details
      - state
      - fire_count
      - fired_at
      - last_fired_at
      properties:
        acked_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Acknowledged at.
        acked_by:
          type:
          - string
          - 'null'
          description: Acknowledged by (principal id).
        code:
          type: string
          description: Machine code, like `node.disk_low`.
        details:
          type: object
          description: Extra facts.
        fire_count:
          type: integer
          format: int32
          description: Times it fired while live.
        fired_at:
          type: string
          format: date-time
          description: First fired.
        id:
          type: string
          description: '`alr_…`.'
        last_fired_at:
          type: string
          format: date-time
          description: Last fired.
        project_id:
          type:
          - string
          - 'null'
          description: '`prj_…` for run alerts.'
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Resolved at.
        resolved_by:
          type:
          - string
          - 'null'
          description: Resolved by (principal id, or `system`).
        scope_id:
          type:
          - string
          - 'null'
          description: '`run_…` or `node_…`; null for system alerts.'
        scope_kind:
          type: string
          description: '`run`, `node` or `system`.'
        severity:
          type: string
          description: '`info`, `warning`, `error` or `critical`.'
        source:
          type: string
          description: 'Who raised it: `safety`, `node`, `budget`, `system` or `metric`.'
        state:
          type: string
          description: '`OPEN`, `ACKED` or `RESOLVED`.'
        title:
          type: string
          description: What happened.
    AlgorithmSchemaDoc:
      type: object
      description: '`GET /algorithms/{algo}/schema`.'
      required:
      - engine
      - version
      - algorithm
      - display_name
      - summary
      - maturity
      - fidelity
      - switch
      - defaults
      - presets
      properties:
        algorithm:
          type: string
          description: Method id.
        config_schema:
          type:
          - object
          - 'null'
          description: JSON Schema for `config.engine` (with `x-mrl-ui` hints), if the method has a form.
        defaults:
          type: object
          description: Recommended values.
        display_name:
          type: string
          description: Shown in the app.
        engine:
          type: string
          description: Engine name.
        fidelity:
          type: string
          description: full, partial or approximation.
        fidelity_note:
          type:
          - string
          - 'null'
          description: Why fidelity is not full.
        maturity:
          type: string
          description: stable, beta or experimental.
        presets:
          type: array
          items:
            type: object
          description: 'Presets: `{id, title, tier, when, patch}` (JSON Merge Patch).'
        summary:
          type: string
          description: One line.
        switch:
          type: object
          description: Pinned engine fields (read-only in the form).
        ui_schema:
          type:
          - object
          - 'null'
          description: UI hints file, if any.
        version:
          type: string
          description: Engine version.
    Artifact:
      type: object
      description: A registered artifact.
      required:
      - id
      - name
      - kind
      - prefix
      - state
      - size_bytes
      - manifest
      - created_by
      - created_at
      - committed_at
      properties:
        committed_at:
          type: string
          format: date-time
          description: When it committed.
        created_at:
          type: string
          format: date-time
          description: When it was registered.
        created_by:
          type: string
          description: Who registered it.
        id:
          type: string
          description: '`art_…`.'
        kind:
          type: string
          description: '`model`, `dataset`, `checkpoint`, `eval`, `export` or `other`.'
        manifest:
          type: object
          description: The manifest.
        name:
          type: string
          description: Name.
        prefix:
          type: string
          description: |-
            Full key prefix the files were registered from. Downloads read the checked copies in
            `blobs/sha256/…`, so later changes there do not matter.
        project_id:
          type:
          - string
          - 'null'
          description: Project.
        size_bytes:
          type: integer
          format: int64
          description: Total bytes.
        state:
          type: string
          description: '`PENDING`, `COMMITTED` or `FAILED`.'
    Attempt:
      type: object
      description: One attempt at running a job.
      required:
      - id
      - job_id
      - attempt_no
      - epoch
      - state
      - created_at
      properties:
        attempt_no:
          type: integer
          format: int32
          description: 1, 2, 3, … per job.
        created_at:
          type: string
          format: date-time
          description: Created.
        ended_at:
