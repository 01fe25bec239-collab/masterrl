          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
