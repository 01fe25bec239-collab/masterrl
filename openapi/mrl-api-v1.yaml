openapi: 3.1.0
info:
  title: MasterRL API
  description: The MasterRL server API. Errors use RFC 9457 problem documents.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.1.0
paths:
  /api/v1/experiments/{exp}:
    get:
      tags:
      - runs
      summary: '`GET /experiments/{exp}`'
      operationId: get_experiment
      parameters:
      - name: exp
        in: path
        description: Experiment id, `exp_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The experiment; `ETag` is its version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '404':
          description: No such experiment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - runs
      summary: '`PATCH /experiments/{exp}`. `If-Match` is optional.'
      operationId: update_experiment
      parameters:
      - name: exp
        in: path
        description: Experiment id, `exp_…`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentPatch'
        required: true
      responses:
        '200':
          description: The changed experiment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '412':
          description: '`If-Match` is stale.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/jobs:
    get:
      tags:
      - jobs
      summary: '`GET /jobs`'
      operationId: list_jobs
      parameters:
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: Only jobs in this state, like `QUEUED`.
        required: false
        schema:
          type: string
      - name: kind
        in: query
        description: Only jobs of this kind, like `TRAIN`.
        required: false
        schema:
          type: string
      - name: project
        in: query
        description: Only jobs in this project (`prj_…`).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of jobs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Job'
  /api/v1/jobs/{job}:
    get:
      tags:
      - jobs
      summary: '`GET /jobs/{job}`'
      operationId: get_job
      parameters:
      - name: job
        in: path
        description: Job id, `job_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The job; `ETag` is its version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: No such job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - jobs
      summary: '`PATCH /jobs/{job}`: change priority (maintainers). `If-Match` is optional.'
      operationId: update_job
      parameters:
      - name: job
        in: path
        description: Job id, `job_…`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPatch'
        required: true
      responses:
        '200':
          description: The changed job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '412':
          description: '`If-Match` is stale.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/jobs/{job}:cancel:
    post:
      tags:
      - jobs
      summary: '`POST /jobs/{job}:cancel` (axum sees `/jobs/{job}` with the action in the segment).'
      operationId: cancel_job
      parameters:
      - name: job
        in: path
        description: Job id, `job_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The job, now CANCELLING or CANCELLED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          description: The job already finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/projects/{prj}/experiments:
    get:
      tags:
      - runs
      summary: '`GET /projects/{prj}/experiments`'
      operationId: list_experiments
      parameters:
      - name: prj
        in: path
        description: Project id, `prj_…`.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of experiments, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Experiment'
    post:
      tags:
      - runs
      summary: '`POST /projects/{prj}/experiments`'
      operationId: create_experiment
      parameters:
      - name: prj
        in: path
        description: Project id, `prj_…`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExperiment'
        required: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '409':
          description: The name is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/projects/{prj}/runs:
    get:
      tags:
      - runs
      summary: '`GET /projects/{prj}/runs`'
      operationId: list_runs
      parameters:
      - name: prj
        in: path
        description: Project id, `prj_…`.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      - name: experiment
        in: query
        description: Only runs in this experiment (`exp_…`).
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: Only runs whose job is in this state, like `REJECTED`.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of runs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Run'
    post:
      tags:
      - runs
      summary: '`POST /projects/{prj}/runs`. Needs `Idempotency-Key`.'
      description: |-
        Creates the run, its config snapshot and its job, then validates: the answer is the
        run in QUEUED, or in REJECTED with every problem and a hint in `state_reason`.
      operationId: submit_run
      parameters:
      - name: prj
        in: path
        description: Project id, `prj_…`.
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: A new random value per run; a retry with the same key returns the same run.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunSubmission'
        required: true
      responses:
        '201':
          description: The run, QUEUED or REJECTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          description: No `Idempotency-Key` (MRL-IDEM-170) or an unreadable body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Fields need a change, or the key was used for another run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/runs/{run}:
    get:
      tags:
      - runs
      summary: '`GET /runs/{run}`'
      operationId: get_run
      parameters:
      - name: run
        in: path
        description: Run id, `run_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          description: No such run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/runs/{run}/attempts:
    get:
      tags:
      - runs
      summary: '`GET /runs/{run}/attempts`'
      operationId: list_run_attempts
      parameters:
      - name: run
        in: path
        description: Run id, `run_…`.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The run's attempts, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Attempt'
  /api/v1/runs/{run}/config:
    get:
      tags:
      - runs
      summary: '`GET /runs/{run}/config`'
      operationId: get_run_config
      parameters:
      - name: run
        in: path
        description: Run id, `run_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The immutable config snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunConfig'
  /api/v1/runs/{run}/timeline:
    get:
      tags:
      - runs
      summary: '`GET /runs/{run}/timeline`: the outbox events of the run''s job and attempts, in order.'
      operationId: get_run_timeline
      parameters:
      - name: run
        in: path
        description: Run id, `run_…`.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: State changes, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_TimelineEntry'
  /api/v1/runs/{run}:cancel:
    post:
      tags:
      - runs
      summary: '`POST /runs/{run}:cancel` (axum sees `/runs/{run}` with the action in the segment).'
      operationId: cancel_run
      parameters:
      - name: run
        in: path
        description: Run id, `run_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The run, now CANCELLING or CANCELLED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '409':
          description: The run already finished (MRL-STATE-170).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /healthz:
    get:
      tags:
      - health
      summary: 'Liveness: the process is up.'
      operationId: healthz
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags:
      - health
      summary: 'Readiness: every module check passes and the server is not shutting down.'
      operationId: readyz
      responses:
        '200':
          description: Ready for traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready, or shutting down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
components:
  schemas:
    Attempt:
      type: object
      description: One attempt at running a job.
      required:
      - id
      - job_id
      - attempt_no
      - epoch
      - state
      - created_at
      properties:
        attempt_no:
          type: integer
          format: int32
          description: 1, 2, 3, … per job.
        created_at:
          type: string
          format: date-time
          description: Created.
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it ended.
        epoch:
          type: integer
          format: int64
          description: The job's epoch when this attempt was created.
        failure_class:
          type:
          - string
          - 'null'
          description: Failure class of an error exit.
        id:
          type: string
          description: '`att_…`.'
        job_id:
          type: string
          description: '`job_…`.'
        last_step:
          type:
          - integer
          - 'null'
          format: int64
          description: Last training step reported.
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it started running.
        state:
          type: string
          description: '`PENDING`, `LAUNCHING`, `RUNNING`, `EXITED_OK`, `EXITED_ERROR`, `LOST`, `KILLED`.'
    CheckResult:
      type: object
      description: One readiness check result.
      required:
      - name
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Why it is not ready.
        name:
          type: string
          description: Check name.
        status:
          type: string
          description: '`ready` or `not_ready`.'
    Experiment:
      type: object
      description: An experiment, as the API shows it.
      required:
      - id
      - project_id
      - name
      - tags
      - version
      - created_by
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
          description: Created.
        created_by:
          type: string
          description: Creator's principal id.
        description:
          type:
          - string
          - 'null'
          description: Free text.
        id:
          type: string
          description: '`exp_…`.'
        name:
          type: string
          description: Unique in the project.
        project_id:
          type: string
          description: '`prj_…`.'
        tags:
          type: array
          items:
            type: string
          description: Labels.
        updated_at:
          type: string
          format: date-time
          description: Last changed.
        version:
          type: integer
          format: int64
          description: Bumped by every change; also the `ETag`.
    ExperimentPatch:
      type: object
      description: '`PATCH /experiments/{exp}` body; absent fields stay as they are.'
      properties:
        description:
          type:
          - string
          - 'null'
          description: New description.
        name:
          type:
          - string
          - 'null'
          description: New name.
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
          description: New labels (replace the old ones).
      additionalProperties: false
    FieldError:
      type: object
      description: One field problem inside a 422 response.
      required:
      - path
      - code
      - message
      - hint
      properties:
        code:
          type: string
          description: Field-level code, like `MRL-VAL-003`.
        hint:
          type: string
          description: How to fix it.
        message:
          type: string
          description: What is wrong with the field.
        path:
          type: string
          description: JSON Pointer to the field, like `/config/peft/r`.
    Health:
      type: object
      description: '`/healthz` body.'
      required:
      - status
      properties:
        status:
          type: string
          description: '`ok`.'
    Job:
      type: object
      description: A job, as the API shows it.
      required:
      - id
      - project_id
      - kind
      - state
      - state_version
      - epoch
      - priority
      - resource_request
      - retry_policy
      - retries_used
      - created_by
      - created_at
      - updated_at
      - version
      properties:
        created_at:
          type: string
          format: date-time
          description: Created.
        created_by:
          type: string
          description: Principal id of the submitter.
        current_attempt_id:
          type:
          - string
          - 'null'
          description: '`att_…`, the latest attempt.'
        epoch:
          type: integer
          format: int64
          description: Fencing epoch.
        failure_class:
          type:
          - string
          - 'null'
          description: Failure class of the last failure, like `OOM/OOM_GPU`.
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it reached a final state.
        id:
          type: string
          description: '`job_…`.'
        kind:
          type: string
          description: '`TRAIN`, `EVAL`, `DATA_PREP`, ….'
        max_runtime_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: Longest allowed run time.
        next_eligible_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Earliest retry time while in RETRY_WAIT.
        pool_id:
          type:
          - string
          - 'null'
          description: '`pool_…`, once placed.'
        priority:
          type: integer
          format: int32
          description: Higher runs first.
        project_id:
          type: string
          description: '`prj_…`.'
        queued_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last time it entered QUEUED.
        resource_request:
          type: object
          description: What the job asks the scheduler for.
        retries_used:
          type: object
          description: Retries used per failure class.
        retry_policy:
          type: object
          description: 'Retry rules: `{auto_tune, budgets}`.'
        run_id:
          type:
          - string
          - 'null'
          description: '`run_…`, for TRAIN and EVAL jobs.'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: First time it entered RUNNING.
        state:
          type: string
          description: '`CREATED`, `QUEUED`, `RUNNING`, `REJECTED`, ….'
        state_reason:
          type:
          - object
          - 'null'
          description: 'Why the job is in this state: `{code, message, problems?}`.'
        state_version:
          type: integer
          format: int64
          description: Bumped by every state change.
        updated_at:
          type: string
          format: date-time
          description: Last changed.
        version:
          type: integer
          format: int64
          description: Bumped by every change; also the `ETag`.
    JobPatch:
      type: object
      description: '`PATCH /jobs/{job}` body.'
      required:
      - priority
      properties:
        priority:
          type: integer
          format: int32
          description: New priority, −1000 to 1000. Higher runs first.
      additionalProperties: false
    NewExperiment:
      type: object
      description: '`POST /projects/{prj}/experiments` body.'
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
          description: Free text.
        name:
          type: string
          description: 1–200 characters, unique in the project.
        tags:
          type: array
          items:
            type: string
          description: Up to 50 labels.
      additionalProperties: false
    Page_Attempt:
      type: object
      description: One page of results.
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            description: One attempt at running a job.
            required:
            - id
            - job_id
            - attempt_no
            - epoch
            - state
            - created_at
            properties:
              attempt_no:
                type: integer
                format: int32
                description: 1, 2, 3, … per job.
              created_at:
                type: string
                format: date-time
                description: Created.
              ended_at:
                type:
                - string
                - 'null'
                format: date-time
                description: When it ended.
              epoch:
                type: integer
                format: int64
                description: The job's epoch when this attempt was created.
              failure_class:
                type:
                - string
                - 'null'
                description: Failure class of an error exit.
              id:
                type: string
                description: '`att_…`.'
              job_id:
                type: string
                description: '`job_…`.'
              last_step:
                type:
                - integer
                - 'null'
                format: int64
                description: Last training step reported.
              started_at:
                type:
                - string
                - 'null'
                format: date-time
                description: When it started running.
              state:
                type: string
                description: '`PENDING`, `LAUNCHING`, `RUNNING`, `EXITED_OK`, `EXITED_ERROR`, `LOST`, `KILLED`.'
          description: The items on this page.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; `null` on the last page.
    Page_Experiment:
      type: object
      description: One page of results.
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            description: An experiment, as the API shows it.
            required:
            - id
            - project_id
            - name
            - tags
            - version
            - created_by
            - created_at
            - updated_at
            properties:
              created_at:
                type: string
                format: date-time
                description: Created.
              created_by:
                type: string
                description: Creator's principal id.
              description:
                type:
                - string
                - 'null'
                description: Free text.
              id:
                type: string
                description: '`exp_…`.'
              name:
                type: string
                description: Unique in the project.
              project_id:
                type: string
                description: '`prj_…`.'
              tags:
                type: array
                items:
                  type: string
                description: Labels.
              updated_at:
                type: string
                format: date-time
                description: Last changed.
              version:
                type: integer
                format: int64
                description: Bumped by every change; also the `ETag`.
          description: The items on this page.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; `null` on the last page.
    Page_Job:
      type: object
      description: One page of results.
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            description: A job, as the API shows it.
            required:
            - id
            - project_id
            - kind
            - state
            - state_version
            - epoch
            - priority
            - resource_request
            - retry_policy
            - retries_used
            - created_by
            - created_at
            - updated_at
            - version
            properties:
              created_at:
                type: string
                format: date-time
                description: Created.
              created_by:
                type: string
                description: Principal id of the submitter.
              current_attempt_id:
                type:
                - string
                - 'null'
                description: '`att_…`, the latest attempt.'
              epoch:
                type: integer
                format: int64
                description: Fencing epoch.
              failure_class:
                type:
                - string
                - 'null'
                description: Failure class of the last failure, like `OOM/OOM_GPU`.
              finished_at:
                type:
                - string
                - 'null'
                format: date-time
                description: When it reached a final state.
              id:
                type: string
                description: '`job_…`.'
              kind:
                type: string
                description: '`TRAIN`, `EVAL`, `DATA_PREP`, ….'
              max_runtime_seconds:
                type:
                - integer
                - 'null'
                format: int64
                description: Longest allowed run time.
              next_eligible_at:
                type:
                - string
