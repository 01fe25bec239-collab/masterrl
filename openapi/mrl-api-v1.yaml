  /api/v1/uploads/{up}:
    get:
      tags:
      - uploads
      summary: Reads an upload and the parts that arrived.
      operationId: get_upload
      parameters:
      - name: up
        in: path
        description: '`up_…`'
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/uploads/{up}/parts/{n}:
    put:
      tags:
      - uploads
      summary: Stores one part. With `x-mrl-content-sha256`, the part must match it.
      operationId: put_part
      parameters:
      - name: up
        in: path
        description: '`up_…`'
        required: true
        schema:
          type: string
      - name: n
        in: path
        description: Part number from 0.
        required: true
        schema:
          type: integer
          format: int64
          minimum: 0
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: array
              items:
                type: integer
                format: int32
                minimum: 0
        required: true
      responses:
        '200':
          description: '`{part, size, sha256}`'
          content:
            application/json:
              schema:
                type: object
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/uploads/{up}:abort:
    post:
      tags:
      - uploads
      summary: Cancels an open upload and deletes its parts.
      operationId: abort_upload
      parameters:
      - name: up
        in: path
        description: '`up_…`'
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/uploads/{up}:complete:
    post:
      tags:
      - uploads
      summary: |-
        Finishes an upload: joins the parts while hashing, checks the sha256 of the whole file
        and stores it as `blobs/sha256/…` (once per content).
      operationId: complete_upload
      parameters:
      - name: up
        in: path
        description: '`up_…`'
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/uploads/{up}:presign:
    post:
      tags:
      - uploads
      summary: |-
        Asks for PUT tickets for parts (default: every part not received yet, at most 1000).
        The tickets point at the server's transfer endpoint on every backend.
      operationId: presign_upload
      parameters:
      - name: up
        in: path
        description: '`up_…`'
        required: true
        schema:
          type: string
      requestBody:
        description: Optional; an empty body asks for every missing part.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignResponse'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
