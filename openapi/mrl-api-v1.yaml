  /api/v1/transfer/{ticket}:
    get:
      tags:
      - artifacts
      summary: Downloads one object with a GET ticket. Supports `Range`.
      operationId: download
      parameters:
      - name: ticket
        in: path
        description: The ticket token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The object bytes.
        '206':
          description: Part of the object.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '416':
          description: The range starts past the end.
    put:
      tags:
      - artifacts
      summary: Uploads one object with a PUT ticket.
      operationId: upload
      parameters:
      - name: ticket
        in: path
        description: The ticket token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: array
              items:
                type: integer
                format: int32
                minimum: 0
        required: true
      responses:
        '200':
          description: '`{key, size, sha256}`'
          content:
            application/json:
              schema:
                type: object
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/uploads:
