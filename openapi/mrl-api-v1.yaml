openapi: 3.1.0
info:
  title: MasterRL API
  description: The MasterRL server API. Errors use RFC 9457 problem documents.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.1.0
paths:
  /api/v1/alerts:
    get:
      tags:
      - alerts
      summary: '`GET /alerts`: the alerts you may see, newest first.'
      operationId: list_alerts
      parameters:
      - name: state
        in: query
        description: '`OPEN`, `ACKED` or `RESOLVED`.'
        required: false
        schema:
          type: string
      - name: scope_kind
        in: query
        description: '`run`, `node` or `system`.'
        required: false
        schema:
          type: string
      - name: run
        in: query
        description: Only this run's alerts, `run_…` (needs `metrics_logs.read` on the run).
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
  /api/v1/alerts/{alr}:ack:
    post:
      tags:
      - alerts
      summary: '`POST /alerts/{alr}:ack` and `POST /alerts/{alr}:resolve`.'
      operationId: ack_alert
      parameters:
      - name: alr
        in: path
        description: '`alr_…`'
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertView'
        '404':
          description: No such alert
        '409':
          description: The alert is resolved (MRL-STATE-220)
  /api/v1/alerts/{alr}:resolve:
    post:
      tags:
      - alerts
      summary: Resolve an alert.
      operationId: resolve_alert
      parameters:
      - name: alr
        in: path
        description: '`alr_…`'
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertView'
        '404':
          description: No such alert
        '409':
          description: The alert is resolved (MRL-STATE-220)
  /api/v1/algorithms/{algo}/schema:
    get:
      tags:
      - engines
      operationId: get_algorithm_schema
      parameters:
      - name: algo
        in: path
        description: Method id, like `sft`.
        required: true
        schema:
          type: string
      - name: engine_version
        in: query
        description: '`<engine>@<version>`, like `trl@1.0.0`; default: the newest live version with the method.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The method's form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgorithmSchemaDoc'
        '404':
          description: No live engine version has this method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/artifacts:
    get:
      tags:
      - artifacts
      summary: Lists committed artifacts, newest last.
      operationId: list_artifacts
      parameters:
      - name: kind
        in: query
        description: Only this kind.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: '`{items: [Artifact], next_cursor}`'
          content:
            application/json:
              schema:
                type: object
    post:
      tags:
      - artifacts
      summary: Registers an artifact.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewArtifact'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/artifacts/{art}:
    get:
      tags:
      - artifacts
      summary: Reads one artifact.
      operationId: get_one
      parameters:
      - name: art
        in: path
        description: '`art_…`'
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/artifacts/{art}:download:
    post:
      tags:
      - artifacts
      summary: '`POST /artifacts/{art}:download` → a GET ticket for one file of a committed artifact.'
      operationId: download_artifact
      parameters:
      - name: art
        in: path
        description: '`art_…`'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
        required: true
      responses:
        '200':
          description: 'A transfer ticket: `{method, key, max_size, expires_at, url, presigned, headers}`.'
          content:
            application/json:
              schema:
                type: object
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/audit:
    get:
      tags:
      - audit
      operationId: list
      parameters:
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      - name: action
        in: query
        description: Only this action, like `auth.session`.
        required: false
        schema:
          type: string
      - name: actor
        in: query
        description: Only this actor, like `usr_…`.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_AuditRecord'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/callback:
    post:
      tags:
      - auth
      operationId: callback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStarted'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      responses:
        '204':
          description: Signed out.
  /api/v1/auth/me:
    get:
      tags:
      - auth
      operationId: me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/session:
    post:
      tags:
      - auth
      operationId: start_session
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStarted'
    delete:
      tags:
      - auth
      operationId: end_session
      responses:
        '204':
          description: Session ended.
  /api/v1/auth/tokens:
    get:
      tags:
      - auth
      operationId: list_tokens
      parameters:
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Your live tokens, newest first, in cursor pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_TokenInfo'
    post:
      tags:
      - auth
      operationId: create_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToken'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewToken'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/tokens/{id}:
    delete:
      tags:
      - auth
      operationId: revoke_token
      parameters:
      - name: id
        in: path
        description: '`tok_…`'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Revoked.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/capabilities:
    get:
      tags:
      - engines
      operationId: get_capabilities
      parameters:
      - name: model_version
        in: query
        description: '`mv_…`: check against this model.'
        required: false
        schema:
          type: string
      - name: dataset_version
        in: query
        description: '`dsv_…`: check against this training dataset.'
        required: false
        schema:
          type: string
      - name: project
        in: query
        description: Project in which model and dataset versions must be visible.
        required: false
        schema:
          type: string
      - name: pool
        in: query
        description: '`pool_…`: only this pool''s machines.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: What can run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityReport'
        '403':
          description: The caller cannot read the requested compute or records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No visible pool or project has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: An id can't be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/checkpoints/{ckpt}:
    get:
      tags:
      - checkpoints
      summary: '`GET /checkpoints/{ckpt}`.'
      operationId: get_checkpoint
      parameters:
      - name: ckpt
        in: path
        description: Checkpoint id, `ckpt_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The checkpoint with its files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointInfo'
        '404':
          description: No such checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - checkpoints
      summary: |-
        `DELETE /checkpoints/{ckpt}`: TOMBSTONED, objects deleted in the background. Refused while
        the checkpoint is the run's final result, its resume point, or a starting point.
      operationId: delete_checkpoint
      parameters:
      - name: ckpt
        in: path
        description: Checkpoint id, `ckpt_…`.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted (or already deleted).
        '409':
          description: Still in use (MRL-CONFLICT-230) or still being saved (MRL-STATE-230).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/checkpoints/{ckpt}:promote:
    post:
      tags:
      - models
      summary: |-
        `POST /checkpoints/{ckpt}:promote` (P23's route; `row` is authorized for
        `checkpoints.read` in `scope`): after a full re-hash, the checkpoint's safetensors model
        files become a new EXPERIMENTAL version of the model named after the run, inspected by an
        import job (which copies the files, so checkpoint retention can't take them away).
      operationId: promote_checkpoint
      parameters:
      - name: ckpt
        in: path
        description: Checkpoint id, `ckpt_…`.
        required: true
        schema:
          type: string
      responses:
        '202':
          description: The new IMPORTING version, in the model named after the run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionInfo'
        '409':
          description: Not COMMITTED, its bytes changed, or no safetensors weights (MRL-MODEL-265).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/checkpoints/{ckpt}:verify:
    post:
      tags:
      - checkpoints
      summary: |-
        `POST /checkpoints/{ckpt}:verify` (axum sees `/checkpoints/{ckpt}` with the action in the
        segment): re-reads every stored byte (`full_rehash`).
      operationId: verify_checkpoint
      parameters:
      - name: ckpt
        in: path
        description: Checkpoint id, `ckpt_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'The checkpoint afterwards: COMMITTED at `full_rehash`, or CORRUPT with the reason.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointInfo'
        '409':
          description: The checkpoint is not COMMITTED (MRL-STATE-230).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/engines:
    get:
      tags:
      - engines
      operationId: list_engines
      responses:
        '200':
          description: Engines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineList'
  /api/v1/engines/{eng}/versions/{ver}:
    get:
      tags:
      - engines
      operationId: get_engine_version
      parameters:
      - name: eng
        in: path
        description: Engine name, like `trl`.
        required: true
        schema:
          type: string
      - name: ver
        in: path
        description: Version, like `1.0.0`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineVersionDetail'
        '404':
          description: No such engine version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/experiments/{exp}:
    get:
      tags:
      - runs
      summary: '`GET /experiments/{exp}`'
      operationId: get_experiment
      parameters:
      - name: exp
        in: path
        description: Experiment id, `exp_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The experiment; `ETag` is its version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '404':
          description: No such experiment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - runs
      summary: '`PATCH /experiments/{exp}`. `If-Match` is optional.'
      operationId: update_experiment
      parameters:
      - name: exp
        in: path
        description: Experiment id, `exp_…`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentPatch'
        required: true
      responses:
        '200':
          description: The changed experiment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '412':
          description: '`If-Match` is stale.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/jobs:
    get:
      tags:
      - jobs
      summary: '`GET /jobs`'
      operationId: list_jobs
      parameters:
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: Only jobs in this state, like `QUEUED`.
        required: false
        schema:
          type: string
      - name: kind
        in: query
        description: Only jobs of this kind, like `TRAIN`.
        required: false
        schema:
          type: string
      - name: project
        in: query
        description: Only jobs in this project (`prj_…`).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of jobs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Job'
  /api/v1/jobs/{job}:
    get:
      tags:
      - jobs
      summary: '`GET /jobs/{job}`'
      operationId: get_job
      parameters:
      - name: job
        in: path
        description: Job id, `job_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The job; `ETag` is its version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: No such job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - jobs
      summary: '`PATCH /jobs/{job}`: change priority (maintainers). `If-Match` is optional.'
      operationId: update_job
      parameters:
      - name: job
        in: path
        description: Job id, `job_…`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPatch'
        required: true
      responses:
        '200':
          description: The changed job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '412':
          description: '`If-Match` is stale.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/jobs/{job}:cancel:
    post:
      tags:
      - jobs
      summary: '`POST /jobs/{job}:cancel` (axum sees `/jobs/{job}` with the action in the segment).'
      operationId: cancel_job
      parameters:
      - name: job
        in: path
        description: Job id, `job_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The job, now CANCELLING or CANCELLED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          description: The job already finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/lineage/{id}:
    get:
      tags:
      - lineage
      summary: Reads the lineage graph around a node.
      operationId: query
      parameters:
      - name: id
        in: path
        description: A typed id, like `run_…`.
        required: true
        schema:
          type: string
      - name: direction
        in: query
        description: |-
          `up` (what the node came from), `down` (what came from it) or `both` (default).
          `upstream` and `downstream` work too.
        required: false
        schema:
          type: string
      - name: depth
        in: query
        description: Steps to walk, 1–10 (default 3).
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/model-versions/{mv}:
    get:
      tags:
      - models
      summary: '`GET /model-versions/{mv}`: the version with its files and compatibility.'
      operationId: get_model_version
      parameters:
      - name: mv
        in: path
        description: Model version id, `mv_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The version with its files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionInfo'
        '404':
          description: No such model version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/model-versions/{mv}:acknowledge-license:
    post:
      tags:
      - models
      summary: '`POST /model-versions/{mv}:acknowledge-license`: the project accepts this license text.'
      operationId: acknowledge_model_license
      parameters:
      - name: mv
        in: path
        description: Model version id, `mv_…`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelVersionAction'
        required: true
      responses:
        '200':
          description: The version afterwards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionInfo'
        '409':
          description: Not READY (MRL-MODEL-263), or another license text (MRL-MODEL-266).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/model-versions/{mv}:approve-remote-code:
    post:
      tags:
      - models
      summary: |-
        `POST /model-versions/{mv}:approve-remote-code`: the version's custom code may run, for
        this exact revision.
      operationId: approve_model_remote_code
      parameters:
      - name: mv
        in: path
        description: Model version id, `mv_…`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelVersionAction'
        required: true
      responses:
        '200':
          description: The version afterwards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionInfo'
        '409':
          description: Not READY (MRL-MODEL-263), or another revision (MRL-MODEL-266).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/model-versions/{mv}:export:
    post:
      tags:
      - models
      summary: |-
        `POST /model-versions/{mv}:export`: the version as a standard Hugging Face folder, kept as
        the job's artifact and sent to S3 or the Hub when asked.
      operationId: export_model_version
      parameters:
      - name: mv
        in: path
        description: Model version id, `mv_…`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportModel'
        required: true
      responses:
        '202':
          description: The export job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelExportJob'
        '409':
          description: Not READY (MRL-MODEL-263), or code not approved (MRL-MODEL-002).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
