openapi: 3.1.0
info:
  title: MasterRL API
  description: The MasterRL server API. Errors use RFC 9457 problem documents.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.1.0
paths:
  /api/v1/audit:
    get:
      tags:
      - audit
      operationId: list
      parameters:
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      - name: action
        in: query
        description: Only this action, like `auth.session`.
        required: false
        schema:
          type: string
      - name: actor
        in: query
        description: Only this actor, like `usr_…`.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_AuditRecord'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/callback:
    post:
      tags:
      - auth
      operationId: callback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStarted'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      responses:
        '204':
          description: Signed out.
  /api/v1/auth/me:
    get:
      tags:
      - auth
      operationId: me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/session:
    post:
      tags:
      - auth
      operationId: start_session
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStarted'
    delete:
      tags:
      - auth
      operationId: end_session
      responses:
        '204':
          description: Session ended.
  /api/v1/auth/tokens:
    get:
      tags:
      - auth
      operationId: list_tokens
      parameters:
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Your live tokens, newest first, in cursor pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_TokenInfo'
    post:
      tags:
      - auth
      operationId: create_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToken'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewToken'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/tokens/{id}:
    delete:
      tags:
      - auth
      operationId: revoke_token
      parameters:
      - name: id
        in: path
        description: '`tok_…`'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Revoked.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/experiments/{exp}:
    get:
      tags:
      - runs
      summary: '`GET /experiments/{exp}`'
      operationId: get_experiment
      parameters:
      - name: exp
        in: path
        description: Experiment id, `exp_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The experiment; `ETag` is its version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '404':
          description: No such experiment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - runs
      summary: '`PATCH /experiments/{exp}`. `If-Match` is optional.'
      operationId: update_experiment
      parameters:
      - name: exp
        in: path
        description: Experiment id, `exp_…`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentPatch'
        required: true
      responses:
        '200':
          description: The changed experiment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '412':
          description: '`If-Match` is stale.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/jobs:
    get:
      tags:
      - jobs
      summary: '`GET /jobs`'
      operationId: list_jobs
      parameters:
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: Only jobs in this state, like `QUEUED`.
        required: false
        schema:
          type: string
      - name: kind
        in: query
        description: Only jobs of this kind, like `TRAIN`.
        required: false
        schema:
          type: string
      - name: project
        in: query
        description: Only jobs in this project (`prj_…`).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of jobs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Job'
  /api/v1/jobs/{job}:
    get:
      tags:
      - jobs
      summary: '`GET /jobs/{job}`'
      operationId: get_job
      parameters:
      - name: job
        in: path
        description: Job id, `job_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The job; `ETag` is its version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: No such job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - jobs
      summary: '`PATCH /jobs/{job}`: change priority (maintainers). `If-Match` is optional.'
      operationId: update_job
      parameters:
      - name: job
        in: path
        description: Job id, `job_…`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPatch'
        required: true
      responses:
        '200':
          description: The changed job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '412':
          description: '`If-Match` is stale.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/jobs/{job}:cancel:
    post:
      tags:
      - jobs
      summary: '`POST /jobs/{job}:cancel` (axum sees `/jobs/{job}` with the action in the segment).'
      operationId: cancel_job
      parameters:
      - name: job
        in: path
        description: Job id, `job_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The job, now CANCELLING or CANCELLED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          description: The job already finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/nodes/{node}:
    get:
      tags:
      - compute
      operationId: get_node
      parameters:
      - name: node
        in: path
        description: '`node_…`'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The machine, its GPUs and latest telemetry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
        '404':
          description: No such machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/nodes/{node}:decommission:
    post:
      tags:
      - compute
      operationId: decommission
      parameters:
      - name: node
        in: path
        description: '`node_…`'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Removed; its certificates are revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeView'
        '404':
          description: No such machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Drain it first, or wait for its attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/nodes/{node}:drain:
    post:
      tags:
      - compute
      operationId: drain
      parameters:
      - name: node
        in: path
        description: '`node_…`'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The machine takes no new work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeView'
        '404':
          description: No such machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Not possible in this state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/orgs:
    get:
      tags:
      - tenancy
      operationId: list_orgs
      parameters:
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Orgs you hold a role in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Org'
    post:
      tags:
      - tenancy
      operationId: create_org
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/orgs/{org}/workspaces:
    get:
      tags:
      - tenancy
      operationId: list_workspaces
      parameters:
      - name: org
        in: path
        description: '`org_…`'
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Workspace'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - tenancy
      operationId: create_workspace
      parameters:
      - name: org
        in: path
        description: '`org_…`'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/pools:
    get:
      tags:
      - compute
      operationId: list_pools
      parameters:
      - name: limit
        in: query
        description: Page size, 1–200.
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: From `next_cursor`.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Pools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_PoolView'
    post:
      tags:
      - compute
      operationId: create_pool
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePool'
        required: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolView'
        '422':
          description: A value needs a change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/pools/{pool}/enrollment-tokens:
    post:
      tags:
      - compute
      operationId: create_enrollment_token
      parameters:
      - name: pool
        in: path
        description: '`pool_…`'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentToken'
        required: true
      responses:
        '201':
          description: The token (shown once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreated'
        '404':
          description: No such pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: A value needs a change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/pools/{pool}/nodes:
    get:
      tags:
      - compute
      operationId: list_nodes
      parameters:
      - name: pool
        in: path
        description: '`pool_…`'
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200.
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: From `next_cursor`.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Machines in the pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_NodeView'
        '404':
          description: No such pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/projects/{prj}/experiments:
    get:
      tags:
      - runs
      summary: '`GET /projects/{prj}/experiments`'
      operationId: list_experiments
      parameters:
      - name: prj
        in: path
        description: Project id, `prj_…`.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of experiments, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Experiment'
    post:
      tags:
      - runs
      summary: '`POST /projects/{prj}/experiments`'
      operationId: create_experiment
      parameters:
      - name: prj
        in: path
        description: Project id, `prj_…`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExperiment'
        required: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '409':
          description: The name is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/projects/{prj}/runs:
    get:
      tags:
      - runs
      summary: '`GET /projects/{prj}/runs`'
      operationId: list_runs
      parameters:
      - name: prj
        in: path
        description: Project id, `prj_…`.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      - name: experiment
        in: query
        description: Only runs in this experiment (`exp_…`).
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: Only runs whose job is in this state, like `REJECTED`.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of runs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Run'
    post:
      tags:
      - runs
      summary: '`POST /projects/{prj}/runs`. Needs `Idempotency-Key`.'
      description: |-
        Creates the run, its config snapshot and its job, then validates: the answer is the
        run in QUEUED, or in REJECTED with every problem and a hint in `state_reason`.
      operationId: submit_run
      parameters:
      - name: prj
        in: path
        description: Project id, `prj_…`.
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: A new random value per run; a retry with the same key returns the same run.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunSubmission'
        required: true
      responses:
        '201':
          description: The run, QUEUED or REJECTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          description: No `Idempotency-Key` (MRL-IDEM-170) or an unreadable body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Fields need a change, or the key was used for another run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/runs/{run}:
    get:
      tags:
      - runs
      summary: '`GET /runs/{run}`'
      operationId: get_run
      parameters:
      - name: run
        in: path
        description: Run id, `run_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          description: No such run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/runs/{run}/attempts:
    get:
      tags:
      - runs
      summary: '`GET /runs/{run}/attempts`'
      operationId: list_run_attempts
      parameters:
      - name: run
        in: path
        description: Run id, `run_…`.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The run's attempts, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Attempt'
  /api/v1/runs/{run}/config:
    get:
      tags:
      - runs
      summary: '`GET /runs/{run}/config`'
      operationId: get_run_config
      parameters:
      - name: run
        in: path
        description: Run id, `run_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The immutable config snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunConfig'
  /api/v1/runs/{run}/timeline:
    get:
      tags:
      - runs
      summary: '`GET /runs/{run}/timeline`: the outbox events of the run''s job and attempts, in order.'
      operationId: get_run_timeline
      parameters:
      - name: run
        in: path
        description: Run id, `run_…`.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: State changes, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_TimelineEntry'
  /api/v1/runs/{run}:cancel:
    post:
      tags:
      - runs
      summary: '`POST /runs/{run}:cancel` (axum sees `/runs/{run}` with the action in the segment).'
      operationId: cancel_run
      parameters:
      - name: run
        in: path
        description: Run id, `run_…`.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The run, now CANCELLING or CANCELLED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '409':
          description: The run already finished (MRL-STATE-170).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/sync/profile:
    get:
      tags:
      - sync
      operationId: get_profile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupProfile'
    put:
      tags:
      - sync
      operationId: put_profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupProfile'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupProfile'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/sync/push:
    post:
      tags:
      - sync
      operationId: push
      requestBody:
        description: 'Optional: `{"op_id": "<uuid>"}`, the same on retries.'
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/PushRequest'
              - type: 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pushed'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/sync/restore:
    post:
      tags:
      - sync
      operationId: restore
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restored'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/sync/setup:
    post:
      tags:
      - sync
      operationId: setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupDone'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/sync/status:
    get:
      tags:
      - sync
      operationId: status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
  /api/v1/workspaces/{ws}/projects:
    get:
      tags:
      - tenancy
      operationId: list_projects
      parameters:
      - name: ws
        in: path
        description: '`ws_…`'
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Project'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - tenancy
      operationId: create_project
      parameters:
      - name: ws
        in: path
        description: '`ws_…`'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /healthz:
    get:
      tags:
      - health
      summary: 'Liveness: the process is up.'
      operationId: healthz
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags:
      - health
      summary: 'Readiness: every module check passes and the server is not shutting down.'
      operationId: readyz
      responses:
        '200':
          description: Ready for traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready, or shutting down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
components:
  schemas:
    Attempt:
      type: object
      description: One attempt at running a job.
      required:
      - id
      - job_id
      - attempt_no
      - epoch
      - state
      - created_at
      properties:
        attempt_no:
          type: integer
          format: int32
          description: 1, 2, 3, … per job.
        created_at:
          type: string
          format: date-time
          description: Created.
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it ended.
        epoch:
          type: integer
          format: int64
          description: The job's epoch when this attempt was created.
        failure_class:
          type:
          - string
          - 'null'
          description: Failure class of an error exit.
        id:
          type: string
          description: '`att_…`.'
        job_id:
          type: string
          description: '`job_…`.'
        last_step:
          type:
          - integer
          - 'null'
          format: int64
          description: Last training step reported.
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it started running.
        state:
          type: string
          description: '`PENDING`, `LAUNCHING`, `RUNNING`, `EXITED_OK`, `EXITED_ERROR`, `LOST`, `KILLED`.'
    AuditRecord:
      type: object
      description: One audit record.
      required:
      - id
      - at
      - actor
      - action
      - target
      - outcome
      - details
      - trace_id
      properties:
        action:
          type: string
          description: What, like `auth.manage_tokens`.
        actor:
          type: string
          description: Who.
        at:
          type: string
          format: date-time
          description: When.
        details:
          type: object
          description: Extra facts (never secret values).
        id:
          type: string
          description: Record id.
        org:
          type:
          - string
          - 'null'
          description: Org.
        outcome:
          type: string
          description: '`success`, `denied` or `failed`.'
        project:
          type:
          - string
          - 'null'
          description: Project.
        target:
          type: string
          description: On what.
        trace_id:
          type: string
          description: Trace id.
    CallbackRequest:
      type: object
      description: Finish a sign-in with the code from the callback.
      required:
      - flow_id
      - code
      properties:
        code:
          type: string
          description: '`code` from the callback query.'
        flow_id:
          type: string
          description: '`flow` from the callback query.'
        issue_token:
          type: boolean
          description: Also make an access token (for the CLI).
        token_name:
          type:
          - string
          - 'null'
          description: Name for that token.
      additionalProperties: false
    CheckResult:
      type: object
      description: One readiness check result.
      required:
      - name
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Why it is not ready.
        name:
          type: string
          description: Check name.
        status:
          type: string
          description: '`ready` or `not_ready`.'
    CopyInfo:
      type: object
      description: A saved copy (metadata only).
      required:
      - version
      - at
      properties:
        at:
          type: string
          description: When it was pushed.
        version:
          type: integer
          format: int64
          description: Version.
    CreateEnrollmentToken:
      type: object
      description: '`POST /pools/{pool}/enrollment-tokens`.'
      properties:
        endpoint:
          oneOf:
          - $ref: '#/components/schemas/Endpoint'
            description: Set when the core should dial the new machine (its agent waits with `enroll --listen`).
          - type: 'null'
        labels:
          type:
          - object
          - 'null'
          description: Labels the new machine gets.
        lifecycle:
          oneOf:
          - $ref: '#/components/schemas/Lifecycle'
            description: STATIC (default) or EPHEMERAL.
          - type: 'null'
        ttl_seconds:
          type:
          - integer
          - 'null'
          format: int32
          description: How long the token works, 60 s – 7 days (default 1 hour).
          minimum: 0
      additionalProperties: false
    CreatePool:
      type: object
      description: '`POST /pools`.'
      required:
      - name
      properties:
        attempt_lease_ttl_seconds:
          type:
          - integer
          - 'null'
          format: int32
          description: Attempt lease length, 10–3600 s (default 90).
          minimum: 0
        flags:
          type: array
          items:
            type: string
          description: Flags.
        name:
          type: string
          description: Unique name, 1–100 characters.
        provider_kind:
          type:
          - string
          - 'null'
          description: '`agent` (default), `kubernetes`, `slurm` or `cloud_vm`.'
      additionalProperties: false
    CreateToken:
      type: object
      description: Make an access token.
      required:
      - name
      - scopes
      properties:
        days:
          type:
          - integer
          - 'null'
          format: int32
          description: Lifetime, 1–365 days (default from `auth.token_days`).
          minimum: 0
        name:
          type: string
          description: A name you recognize, 1–100 characters.
        project_id:
          type:
          - string
          - 'null'
          description: Limit the token to one project (`prj_…`).
        scopes:
          type: array
          items:
            type: string
          description: '`["*"]`, or areas like `["runs:write", "datasets:read"]`.'
      additionalProperties: false
    Endpoint:
      oneOf:
      - type: object
        description: The agent listens on this `host:port` in the local network.
        required:
        - address
        - kind
        properties:
          address:
            type: string
            description: '`host:port`.'
          kind:
            type: string
            enum:
            - direct
      - type: object
        description: The core opens SSH to `host` and forwards to the agent's loopback port.
        required:
        - host
        - agent_port
        - kind
        properties:
          agent_port:
            type: integer
            format: int32
            description: The agent's `gateway.listen` port on the machine's loopback.
            minimum: 0
          host:
            type: string
            description: Host name, address or `~/.ssh/config` alias.
          key_secret:
            type:
            - string
            - 'null'
            description: |-
              Secret-store name of an OpenSSH private key (optional; the SSH agent and
              `~/.ssh` keys are tried too).
          kind:
            type: string
            enum:
            - ssh
          port:
            type:
            - integer
            - 'null'
            format: int32
            description: 'SSH port (default: from `~/.ssh/config`, else 22).'
            minimum: 0
          user:
            type:
            - string
            - 'null'
            description: 'SSH user (default: from `~/.ssh/config`, else this account''s name).'
      - type: object
        description: The agent listens on this Tailscale `address:port` (100.x or MagicDNS name).
        required:
        - address
        - kind
        properties:
          address:
            type: string
            description: '`host:port`.'
          kind:
            type: string
            enum:
            - tailscale
      - type: object
        description: The agent is exposed by `cloudflared` on this hostname.
        required:
        - hostname
        - kind
        properties:
          hostname:
            type: string
            description: The tunnel's public hostname.
          kind:
            type: string
            enum:
            - cloudflare_tunnel
      description: How the core dials one machine (stored in `compute_nodes.endpoint`).
    Experiment:
      type: object
      description: An experiment, as the API shows it.
      required:
      - id
      - project_id
      - name
      - tags
      - version
      - created_by
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
          description: Created.
        created_by:
          type: string
          description: Creator's principal id.
        description:
          type:
          - string
          - 'null'
          description: Free text.
        id:
          type: string
          description: '`exp_…`.'
        name:
          type: string
          description: Unique in the project.
        project_id:
          type: string
          description: '`prj_…`.'
        tags:
          type: array
          items:
            type: string
          description: Labels.
        updated_at:
          type: string
          format: date-time
          description: Last changed.
        version:
          type: integer
          format: int64
          description: Bumped by every change; also the `ETag`.
    ExperimentPatch:
      type: object
      description: '`PATCH /experiments/{exp}` body; absent fields stay as they are.'
      properties:
        description:
          type:
          - string
          - 'null'
          description: New description.
        name:
          type:
          - string
          - 'null'
          description: New name.
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
          description: New labels (replace the old ones).
      additionalProperties: false
    FieldError:
      type: object
      description: One field problem inside a 422 response.
      required:
      - path
      - code
      - message
      - hint
      properties:
        code:
          type: string
          description: Field-level code, like `MRL-VAL-003`.
        hint:
          type: string
          description: How to fix it.
        message:
          type: string
          description: What is wrong with the field.
        path:
          type: string
          description: JSON Pointer to the field, like `/config/peft/r`.
    GpuView:
      type: object
      description: A GPU and its latest reading.
      required:
      - id
      - vendor
      - device_uuid
      - index
      - model
      - arch
      - vram_total_bytes
      - health
      properties:
        arch:
          type: string
          description: Architecture, like `sm_80`.
        device_uuid:
          type: string
          description: Vendor UUID (stable identity).
        health:
          type: string
          description: OK, DEGRADED, FAILED or QUARANTINED.
        id:
          type: string
          description: '`gpu_…`.'
        index:
          type: integer
          format: int32
          description: Index on the node.
        memory_used_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: Latest memory use.
        model:
          type: string
          description: Model name.
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the reading was taken.
        temperature_c:
          type:
          - integer
          - 'null'
          format: int32
          description: Latest temperature.
        thermal_throttling:
          type:
          - boolean
          - 'null'
          description: Latest thermal throttling flag.
        utilization_percent:
          type:
          - integer
          - 'null'
          format: int32
          description: Latest utilization (TELEMETRY lane).
        vendor:
          type: string
          description: '`nvidia`, `amd`, `apple`, `intel` or `other`.'
        vram_total_bytes:
          type: integer
          format: int64
          description: Memory.
    Health:
      type: object
      description: '`/healthz` body.'
      required:
      - status
      properties:
        status:
          type: string
          description: '`ok`.'
    Job:
      type: object
      description: A job, as the API shows it.
      required:
      - id
      - project_id
      - kind
      - state
      - state_version
      - epoch
      - priority
      - resource_request
      - retry_policy
      - retries_used
      - created_by
      - created_at
      - updated_at
      - version
      properties:
        created_at:
          type: string
          format: date-time
          description: Created.
        created_by:
          type: string
          description: Principal id of the submitter.
        current_attempt_id:
          type:
          - string
          - 'null'
          description: '`att_…`, the latest attempt.'
        epoch:
          type: integer
          format: int64
          description: Fencing epoch.
        failure_class:
          type:
          - string
          - 'null'
          description: Failure class of the last failure, like `OOM/OOM_GPU`.
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it reached a final state.
        id:
          type: string
          description: '`job_…`.'
        kind:
          type: string
          description: '`TRAIN`, `EVAL`, `DATA_PREP`, ….'
        max_runtime_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: Longest allowed run time.
        next_eligible_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Earliest retry time while in RETRY_WAIT.
        pool_id:
          type:
          - string
          - 'null'
          description: '`pool_…`, once placed.'
        priority:
          type: integer
          format: int32
          description: Higher runs first.
        project_id:
          type: string
          description: '`prj_…`.'
        queued_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last time it entered QUEUED.
        resource_request:
          type: object
          description: What the job asks the scheduler for.
        retries_used:
          type: object
          description: Retries used per failure class.
        retry_policy:
          type: object
          description: 'Retry rules: `{auto_tune, budgets}`.'
        run_id:
          type:
          - string
          - 'null'
          description: '`run_…`, for TRAIN and EVAL jobs.'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: First time it entered RUNNING.
        state:
          type: string
          description: '`CREATED`, `QUEUED`, `RUNNING`, `REJECTED`, ….'
        state_reason:
          type:
          - object
          - 'null'
          description: 'Why the job is in this state: `{code, message, problems?}`.'
        state_version:
          type: integer
          format: int64
          description: Bumped by every state change.
        updated_at:
          type: string
          format: date-time
          description: Last changed.
        version:
          type: integer
          format: int64
          description: Bumped by every change; also the `ETag`.
    JobPatch:
      type: object
      description: '`PATCH /jobs/{job}` body.'
      required:
      - priority
      properties:
        priority:
          type: integer
          format: int32
          description: New priority, −1000 to 1000. Higher runs first.
      additionalProperties: false
    Lifecycle:
      type: string
      description: Node lifecycle (Doc 04 PBC-04-5).
      enum:
      - STATIC
      - EPHEMERAL
    LoginRequest:
      type: object
      description: Start a sign-in.
      required:
      - provider
      - redirect_uri
      properties:
        provider:
          type: string
          description: '`google` or `github`.'
        redirect_uri:
          type: string
          description: '`masterrl://auth/callback`, or a loopback address like `http://127.0.0.1:53111/callback`.'
      additionalProperties: false
    LoginStarted:
      type: object
      description: Open `authorize_url` in the system browser.
      required:
      - authorize_url
      - flow_id
      properties:
        authorize_url:
          type: string
          description: The address to open.
        flow_id:
          type: string
          description: Pass back with the code; also in the callback query as `flow`.
    Machine:
      type: object
      description: One connected machine.
      required:
      - name
      - address
      - transport
      properties:
        address:
          type: string
          description: Host name or address.
        name:
          type: string
          description: Name shown in the app.
        transport:
          $ref: '#/components/schemas/Transport'
          description: How to reach it.
      additionalProperties: false
    Me:
      type: object
      description: The caller.
      required:
      - principal_kind
      - sign_in
      - roles
      properties:
        principal_kind:
          type: string
          description: '`local_owner`, `user` or `service`.'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleInfo'
          description: Roles.
        sign_in:
          $ref: '#/components/schemas/SignInState'
          description: This install's Supabase sign-in (solo mode).
        token_id:
          type:
          - string
          - 'null'
          description: '`tok_…` when the caller uses an access token.'
        user:
          oneOf:
          - $ref: '#/components/schemas/UserInfo'
            description: The person (absent for an unknown principal).
          - type: 'null'
    NewExperiment:
      type: object
      description: '`POST /projects/{prj}/experiments` body.'
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
          description: Free text.
        name:
          type: string
          description: 1–200 characters, unique in the project.
        tags:
          type: array
          items:
            type: string
          description: Up to 50 labels.
      additionalProperties: false
    NewItem:
      type: object
      description: A new org, workspace or project.
      required:
      - slug
      - name
      properties:
        name:
          type: string
          description: Display name, 1–100 characters.
        slug:
          type: string
          description: 'Short name used in addresses: 1–63 lower-case letters, digits and `-`, starting with a letter or digit.'
      additionalProperties: false
    NewToken:
      type: object
      description: A token, shown once.
      required:
      - id
      - token
      - scopes
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
          description: Expiry.
        id:
          type: string
          description: '`tok_…`.'
        scopes:
          type: array
          items:
            type: string
          description: Scopes.
        token:
          type: string
          description: '`mrl_pat_…`. Store it now; it is never shown again.'
    NodeDetail:
      allOf:
      - $ref: '#/components/schemas/NodeView'
        description: The machine.
      - type: object
        required:
        - gpus
        properties:
          gpus:
            type: array
            items:
              $ref: '#/components/schemas/GpuView'
            description: Its GPUs with their latest readings.
          inventory:
            type:
            - object
            - 'null'
            description: The last full inventory.
          telemetry:
            type:
            - object
            - 'null'
            description: Latest node readings (memory, disk, battery).
          telemetry_at:
            type:
            - string
            - 'null'
            format: date-time
            description: When those were taken.
      description: A machine with its GPUs, inventory and latest telemetry.
    NodeView:
      type: object
      description: A machine.
      required:
      - id
      - pool_id
      - hostname
      - lifecycle
      - status
      - status_version
      - session_epoch
      - labels
      - running_attempts
      - created_at
      properties:
        agent_version:
          type:
          - string
          - 'null'
          description: Agent version.
        cert_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the current certificate ends.
        created_at:
          type: string
          format: date-time
          description: Enrolled.
        hostname:
          type: string
          description: Host name the agent reported.
        id:
          type: string
          description: '`node_…`.'
        labels:
          type: object
          description: Labels from the join token.
        last_heartbeat_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last heartbeat.
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
          description: STATIC or EPHEMERAL.
        pool_id:
          type: string
          description: '`pool_…`.'
        protocol_version:
          type:
          - string
          - 'null'
          description: Gateway protocol version.
        running_attempts:
          type: integer
          format: int32
          description: Attempts running at the last heartbeat.
        session_epoch:
          type: integer
          format: int64
          description: Bumped on every new CONTROL session.
        status:
          type: string
          description: ENROLLING, ONLINE, DEGRADED, OFFLINE, DRAINING or DECOMMISSIONED.
        status_reason:
          type:
          - string
          - 'null'
          description: Why the status last changed.
        status_version:
          type: integer
          format: int64
          description: Bumped on every status change.
        transport:
          type:
          - string
