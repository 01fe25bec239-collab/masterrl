        id:
          type: string
          description: Record id.
        org:
          type:
          - string
          - 'null'
          description: Org.
        outcome:
          type: string
          description: '`success`, `denied` or `failed`.'
        project:
          type:
          - string
          - 'null'
          description: Project.
        target:
          type: string
          description: On what.
        trace_id:
          type: string
          description: Trace id.
    CallbackRequest:
      type: object
      description: Finish a sign-in with the code from the callback.
