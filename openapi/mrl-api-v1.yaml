        version:
          type: integer
          format: int64
          description: Version.
    CreateEnrollmentToken:
      type: object
      description: '`POST /pools/{pool}/enrollment-tokens`.'
      properties:
        endpoint:
          oneOf:
          - $ref: '#/components/schemas/Endpoint'
            description: Set when the core should dial the new machine (its agent waits with `enroll --listen`).
          - type: 'null'
        labels:
          type:
          - object
          - 'null'
          description: Labels the new machine gets.
        lifecycle:
          oneOf:
