          Comma-separated series IDs or names. Use `name:` before a numeric name.
          A name selects every split. Defaults to the first 20 series.
        required: false
        schema:
          type: string
      - name: axis
        in: query
        description: '`step` (default) or `time`.'
        required: false
        schema:
          type: string
      - name: from_step
        in: query
        description: First step (step axis).
        required: false
        schema:
          type: string
      - name: to_step
        in: query
        description: Last step (step axis).
        required: false
        schema:
          type: string
      - name: from_time
        in: query
        description: First second since 1970 (time axis).
        required: false
        schema:
          type: string
      - name: to_time
        in: query
        description: Last second since 1970 (time axis).
        required: false
        schema:
          type: string
      - name: max_points
        in: query
        description: 2–10000, default 1000.
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricQueryResult'
        '404':
          description: No such run
        '422':
          description: A parameter is out of range
  /api/v1/runs/{run}/samples:
    get:
      tags:
      - telemetry
      summary: '`GET /runs/{run}/samples`.'
      operationId: list_run_samples
      parameters:
      - name: run
        in: path
        description: '`run_…`'
        required: true
        schema:
          type: string
      - name: step
        in: query
        description: Only this step.
        required: false
        schema:
          type: string
      - name: min_step
        in: query
        description: Steps from here.
        required: false
        schema:
          type: string
      - name: max_step
        in: query
        description: Steps up to here.
        required: false
        schema:
          type: string
      - name: min_reward
        in: query
        description: Only samples with at least this total reward.
        required: false
        schema:
          type: string
      - name: max_reward
        in: query
        description: Only samples with at most this total reward.
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: Only samples whose prompt or completion contains this text (ignores case).
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 1–500 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamplePage'
        '404':
          description: No such run
        '503':
          description: A sample file could not be read (MRL-STORE-220)
  /api/v1/runs/{run}/timeline:
    get:
      tags:
      - runs
      summary: '`GET /runs/{run}/timeline`: the outbox events of the run''s job and attempts, in order.'
      operationId: get_run_timeline
      parameters:
      - name: run
        in: path
        description: Run id, `run_…`.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1–200 (default 50).
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
