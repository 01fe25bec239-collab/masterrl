    NewArtifact:
      type: object
      description: '`POST /artifacts` body.'
      required:
      - name
      - manifest
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/NewLink'
          description: Lineage links written when the artifact commits.
        manifest:
          type: object
          description: The `artifact-manifest/v1` document.
        name:
          type: string
          description: Unique name in the org (or project).
        prefix:
          type:
          - string
          - 'null'
          description: |-
            Folder of the files, relative to the org, ending in `/` (like `exports/exp1/`). Only
            the server's own modules may use it ([`ArtifactStore::register`]); the HTTP API
            refuses it and takes `uploads` instead, since a folder says nothing about who may
            read its files.
        project_id:
          type:
          - string
          - 'null'
          description: Project, if the artifact belongs to one.
        uploads:
          type: object
          description: |-
            Where each file's bytes are: manifest path → id of a finished upload the caller may
            see, with exactly that size and sha256. Every file needs one.
          additionalProperties:
            type: string
          propertyNames:
            type: string
      additionalProperties: false
    NewExperiment:
      type: object
      description: '`POST /projects/{prj}/experiments` body.'
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
          description: Free text.
        name:
          type: string
          description: 1–200 characters, unique in the project.
        tags:
          type: array
          items:
            type: string
          description: Up to 50 labels.
      additionalProperties: false
    NewItem:
