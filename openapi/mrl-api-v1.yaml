      - attempt_id
      - attempt_epoch
      - step
      - kind
      - layout
      - is_final
      - state
      - metrics
      - created_at
      properties:
        attempt_epoch:
          type: integer
          format: int64
          description: That attempt's fencing epoch.
        attempt_id:
          type: string
          description: The attempt that wrote it.
        committed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Committed.
        corrupt_reason:
          type:
          - string
          - 'null'
          description: Why it is CORRUPT.
        created_at:
          type: string
          format: date-time
          description: Staged.
        file_count:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of files.
        files:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CheckpointFileInfo'
          description: The files (only on `GET /checkpoints/{ckpt}`).
        id:
          type: string
          description: '`ckpt_…`.'
        is_final:
          type: boolean
          description: The run's final checkpoint.
        kind:
          type: string
          description: '`full_resume`, `weights_only` or `adapter_only`.'
        layout:
          type: string
          description: Format tag, like `hf-trainer-v1`.
        metrics:
          type: object
          description: Metrics at this step.
        run_id:
          type: string
          description: '`run_…`.'
        state:
          type: string
          description: '`WRITING`, `UPLOADED`, `VERIFYING`, `COMMITTED`, `CORRUPT` or `TOMBSTONED`.'
        step:
          type: integer
          format: int64
          description: Training step.
        total_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: Sum of file sizes.
        verification_level:
          type:
          - string
          - 'null'
          description: '`manifest_head` (files present with their sizes) or `full_rehash` (every byte re-read).'
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last verified.
    CopyInfo:
      type: object
