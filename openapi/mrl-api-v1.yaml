          description: '`mv_…`.'
        created_at:
          type: string
          format: date-time
          description: Created.
        created_by:
          type: string
          description: Submitter's principal id.
        engine_version_id:
          type:
          - string
          - 'null'
          description: The engine version picked by validation, once engines are registered.
        experiment_id:
          type: string
          description: '`exp_…`.'
        failure_class:
          type:
          - string
          - 'null'
          description: Failure class of the last failure.
        final_checkpoint_id:
          type:
          - string
          - 'null'
          description: Final checkpoint, `ckpt_…`.
        id:
          type: string
          description: '`run_…`.'
        job_id:
          type: string
          description: The run's job, `job_…`.
        kind:
          type: string
          description: '`TRAIN` or `EVAL`.'
        latest_committed_checkpoint_id:
          type:
          - string
          - 'null'
          description: Latest committed checkpoint, `ckpt_…`.
        name:
          type: string
          description: Name.
        parent_checkpoint_id:
          type:
          - string
          - 'null'
          description: '`ckpt_…` this run starts from.'
        parent_run_id:
          type:
          - string
          - 'null'
          description: '`run_…` this run branches from.'
        project_id:
          type: string
          description: '`prj_…`.'
        reward_version_id:
          type:
          - string
          - 'null'
          description: '`rwdv_…`.'
        state:
          type: string
          description: 'The job''s state: `QUEUED`, `RUNNING`, `REJECTED`, ….'
        state_reason:
          type:
          - object
          - 'null'
          description: 'Why: `{code, message, problems?}`; for REJECTED, every problem with a hint.'
    RunConfig:
      type: object
      description: The immutable config snapshot of a run.
      required:
      - run_id
      - submitted
      - resolved
      - resolved_sha256
      - dataset_version_ids
      - seeds
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
          description: Created.
        dataset_version_ids:
          type: array
          items:
            type: string
          description: Dataset versions, `dsv_…`.
        resolved:
          type: object
          description: 'The config after every resolver: what the engine receives.'
        resolved_sha256:
          type: string
          description: Hex SHA-256 of `resolved` (compact JSON, sorted keys).
        run_id:
          type: string
          description: '`run_…`.'
        runtime_ref:
          type:
          - string
          - 'null'
          description: Image digest or lock hash, once pinned.
        seeds:
          type: object
          description: Random seeds.
        submitted:
          type: object
          description: What was submitted (the whole request body).
    RunKind:
      type: string
      description: Run kinds (other job kinds have no run).
      enum:
      - TRAIN
      - EVAL
    RunSubmission:
      type: object
      description: '`POST /projects/{prj}/runs` body.'
      required:
      - name
      - algorithm_id
      - base_model_version_id
      properties:
        algorithm_id:
          type: string
          description: The method, like `sft`, `dpo` or `grpo`.
        base_model_version_id:
          type: string
          description: The model version to start from, `mv_…`.
        config:
          type: object
          description: The method's settings (a JSON object).
        dataset_version_ids:
          type: array
          items:
            type: string
          description: Dataset versions, `dsv_…`.
        experiment_id:
          type:
          - string
          - 'null'
          description: '`exp_…`; without it the run joins the project''s `default` experiment.'
        kind:
          $ref: '#/components/schemas/RunKind'
          description: '`TRAIN` (default) or `EVAL`.'
        max_runtime_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: Longest allowed run time in seconds.
        name:
          type: string
          description: 1–200 characters.
        parent_checkpoint_id:
          type:
          - string
          - 'null'
          description: The checkpoint this one starts from, `ckpt_…`.
        parent_run_id:
          type:
          - string
          - 'null'
          description: The run this one branches from, `run_…`.
        priority:
          type: integer
          format: int32
          description: Higher runs first, −1000 to 1000 (default 0).
        resources:
          type:
          - object
          - 'null'
          description: What the job asks the scheduler for; default one trainer with one GPU.
        retry:
          type:
          - object
          - 'null'
          description: 'Retry rules: `{auto_tune, budgets: {CLASS: n}}`.'
        reward_version_id:
          type:
          - string
          - 'null'
          description: The reward version, `rwdv_…`.
        seeds:
          type:
          - object
          - 'null'
          description: 'Random seeds; the server picks `{"global": n}` when absent.'
      additionalProperties: false
    SessionStarted:
      type: object
      description: A renderer session started; the cookie is in `Set-Cookie`.
      required:
      - csrf_token
      - expires_at
      properties:
        csrf_token:
          type: string
          description: Send as `x-csrf-token` on requests from another origin.
        expires_at:
          type: string
          format: date-time
          description: When the session ends at the latest.
    SetupDone:
      type: object
      description: Setup sync is on.
      required:
      - recovery_key
      properties:
        recovery_key:
          type: string
          description: Shown once. It opens your saved setup if you forget the passphrase.
    SetupProfile:
      type: object
      description: '`setup-profile/v1`.'
      required:
      - schema
      properties:
        machines:
          type: array
          items:
            $ref: '#/components/schemas/Machine'
          description: Connected machines.
        preferences:
          type: object
          description: App preferences.
        schema:
          type: string
          description: Always `setup-profile/v1`.
        team_memberships:
          type: array
          items:
            $ref: '#/components/schemas/TeamMembership'
          description: Teams.
        ui:
          type: object
          description: UI settings.
      additionalProperties: false
    SetupRequest:
      type: object
      description: Turn on setup sync.
      required:
      - passphrase
      properties:
        passphrase:
          type: string
          description: At least 12 characters. A forgotten passphrase (and recovery key) means the setup cannot be restored.
      additionalProperties: false
    SignInState:
      type: string
      description: Where this install's sign-in stands.
      enum:
      - not_configured
      - signed_out
      - active
      - expired
    SignedIn:
      type: object
      description: The sign-in finished.
      required:
      - user
      properties:
        token:
          oneOf:
          - $ref: '#/components/schemas/NewToken'
            description: The new token, when asked for.
          - type: 'null'
        user:
          $ref: '#/components/schemas/UserInfo'
          description: Who signed in.
    SyncStatus:
      type: object
      description: Where setup sync stands.
      required:
      - set_up
      - sign_in
      properties:
        copies:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CopyInfo'
          description: Saved copies, newest first (when signed in and online).
        copies_unavailable:
          type:
          - string
          - 'null'
          description: Why `copies` is missing.
        last_push_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last push.
        last_pushed_version:
          type:
          - integer
          - 'null'
          format: int64
          description: Version of the last push.
        last_restore_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last restore.
        set_up:
          type: boolean
          description: A sync passphrase is set on this install.
        sign_in:
          $ref: '#/components/schemas/SignInState'
          description: This install's sign-in.
    TeamMembership:
      type: object
      description: A team this person belongs to.
      required:
      - name
      - address
      properties:
        address:
          type: string
          description: Address of the team core.
        name:
          type: string
          description: Team name.
        role:
          type:
          - string
          - 'null'
          description: The person's role there.
      additionalProperties: false
    TimelineEntry:
      type: object
      description: 'One timeline entry: an outbox event of the run''s job or one of its attempts.'
      required:
      - type
      - aggregate_kind
      - aggregate_id
      - aggregate_seq
      - payload
      - at
      properties:
        aggregate_id:
          type: string
          description: '`job_…` or `att_…`.'
        aggregate_kind:
          type: string
          description: '`job` or `attempt`.'
        aggregate_seq:
          type: integer
          format: int64
          description: The aggregate's version after the change.
        at:
          type: string
          format: date-time
          description: When it happened.
        payload:
          type: object
          description: The event body (`from`, `to`, `reason`, …).
        type:
          type: string
          description: Event type, like `job.queued`.
    TokenCreated:
      type: object
      description: A new join token. The token is shown once.
      required:
      - id
      - token
      - expires_at
      - ca_sha256
      - lifecycle
      - enroll_command
      properties:
        ca_sha256:
          type: string
          description: The CA fingerprint the agent pins (also inside the token).
        enroll_command:
          type: string
          description: What to run on the machine.
        expires_at:
          type: string
          format: date-time
          description: When it stops working.
        id:
          type: string
          description: Token row id.
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
          description: The machine's lifecycle.
        token:
          type: string
          description: '`mrlj_<secret>_<CA fingerprint>`; single use.'
    TokenInfo:
      type: object
      description: A token as listed (never the token itself).
      required:
      - id
      - name
      - prefix
      - scopes
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
          description: Expiry.
        id:
          type: string
          description: '`tok_…`.'
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last use (to the minute).
        name:
          type: string
          description: Name.
        prefix:
          type: string
          description: First characters, like `mrl_pat_AbCd`.
        scopes:
          type: array
          items:
            type: string
          description: Scopes.
    Transport:
      type: object
      description: |-
        How the app reaches a machine. Only these typed settings: keys and passwords stay in the
        keychain, named by `key_ref`; free-form options are refused (unknown fields).
      required:
      - kind
      properties:
        key_ref:
          type:
          - string
          - 'null'
          description: Name of the keychain secret that holds the key (never the key itself).
        kind:
          type: string
          description: '`lan`, `ssh`, `tailscale` or `cloudflare_tunnel`.'
        port:
          type:
          - integer
          - 'null'
          format: int32
          description: Port, when not the default.
          minimum: 0
        user:
          type:
          - string
          - 'null'
          description: Login name (SSH).
      additionalProperties: false
    UserInfo:
      type: object
      description: A person.
      required:
      - id
      - display_name
      properties:
        avatar_url:
          type:
          - string
          - 'null'
          description: Avatar.
        display_name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email.
        id:
          type: string
          description: '`usr_…`.'
    Workspace:
      type: object
      description: A workspace.
      required:
      - id
      - org_id
      - slug
      - name
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
          description: Created.
        id:
          type: string
          description: '`ws_…`.'
        name:
          type: string
          description: Name.
        org_id:
          type: string
          description: '`org_…`.'
        slug:
          type: string
          description: Slug, unique in the org.
tags:
- name: health
  description: Liveness and readiness.
- name: tenancy
  description: Orgs, workspaces and projects.
- name: audit
  description: The audit log.
- name: auth
  description: Sign-in, access tokens and sessions.
- name: sync
  description: Encrypted setup sync.
- name: runs
  description: Experiments, runs, config snapshots and timelines.
- name: jobs
  description: 'Jobs: state, cancel and priority.'
- name: compute
  description: Pools, machines and their GPUs.
