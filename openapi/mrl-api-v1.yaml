          minimum: 0
        ticket:
          type: object
          description: |-
            The ticket: `PUT` its `url` (the server's `/api/v1/transfer/{ticket}`, so
            `presigned` is false on every backend) with exactly the part's bytes. It expires after
            10 minutes and allows this one part's key and size.
    PoolView:
      type: object
      description: A pool.
      required:
      - id
      - name
      - provider_kind
      - attempt_lease_ttl_seconds
      - flags
      - created_at
      properties:
        attempt_lease_ttl_seconds:
          type: integer
          format: int32
          description: How long an attempt lease lasts without a renewing heartbeat.
          minimum: 0
        created_at:
          type: string
          format: date-time
          description: Created.
        flags:
          type: array
          items:
            type: string
          description: Flags like `pii_allowed`.
        id:
          type: string
          description: '`pool_…`.'
        name:
          type: string
          description: Unique name.
        provider_kind:
          type: string
          description: '`agent`, `kubernetes`, `slurm` or `cloud_vm`.'
    PresignRequest:
      type: object
      description: '`POST /uploads/{up}:presign` body.'
      properties:
        parts:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int64
            minimum: 0
          description: 'Part numbers; default: every part not received yet (at most 1000).'
      additionalProperties: false
    PresignResponse:
      type: object
      description: '`POST /uploads/{up}:presign` answer.'
      required:
      - tickets
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/PartTicket'
          description: One ticket per part asked for.
    Problem:
      type: object
      description: RFC 9457 problem document.
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - trace_id
      properties:
        code:
          type: string
          description: The error code, like `MRL-AUTH-001`.
        detail:
          type: string
          description: What happened in this case.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Field problems, present on 422.
        instance:
          type: string
          description: The request path.
        status:
          type: integer
          format: int32
          description: HTTP status.
          minimum: 0
        title:
          type: string
          description: Plain-language title from the guidance catalog.
        trace_id:
          type: string
          description: Trace id to quote in reports.
        type:
          type: string
          description: '`https://docs.masterrl.dev/errors/<code>`.'
    Project:
      type: object
      description: A project.
      required:
      - id
      - org_id
      - workspace_id
      - slug
      - name
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
          description: Created.
        id:
          type: string
          description: '`prj_…`.'
        name:
          type: string
          description: Name.
        org_id:
          type: string
          description: '`org_…`.'
        slug:
          type: string
          description: Slug, unique in the workspace.
        workspace_id:
          type: string
          description: '`ws_…`.'
    PushRequest:
      type: object
      description: '`POST /sync/push` body (optional).'
      properties:
        op_id:
          type:
          - string
          - 'null'
          description: |-
            A UUID the client keeps for one push and sends again on every retry. The saved
            history gains one copy per operation, however often it is retried.
      additionalProperties: false
    Pushed:
      type: object
      description: A copy was saved.
      required:
      - version
      - at
      - copies
      properties:
        at:
          type: string
          description: When.
        copies:
          type: integer
          description: Copies kept now (at most 5).
          minimum: 0
        version:
          type: integer
          format: int64
          description: Its version.
    Readiness:
      type: object
      description: '`/readyz` body.'
      required:
      - status
      - checks
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CheckResult'
          description: Module checks.
        status:
          type: string
          description: '`ready`, `not_ready` or `draining`.'
    Rejection:
      type: object
      description: 'Why a job could not be queued, or a step failed: one problem.'
      required:
      - code
      - message
      - hint
      properties:
        code:
          type: string
          description: Error code, like `MRL-CAP-001`.
        hint:
          type: string
          description: What to do, from the guidance catalog.
        message:
          type: string
          description: What is wrong, in plain words.
        path:
          type:
          - string
          - 'null'
          description: JSON Pointer into the submission, like `/algorithm_id`.
    Relation:
      type: string
      description: How two entities are related (Doc 09 §3.10).
      enum:
      - derived_from
      - trained_on
      - rewarded_by
      - produced
      - promoted_to
      - deployed_as
      - evaluated_by
      - exported_as
      - labelled_from
      - generated_by
    ResourceActualView:
      type: object
      description: Peak resource use of one attempt, device and phase.
      required:
      - attempt_id
      - device
      - phase
      - signal
      - peak
      properties:
        attempt_id:
          type: string
          description: '`att_…`.'
        device:
          type: string
          description: Device, like `gpu0`; empty for the whole host.
        peak:
          type: number
          format: double
          description: Highest value seen.
        phase:
          type: string
          description: Phase.
        signal:
          type: string
          description: What was measured, like `torch_allocated_peak`.
    RestoreRequest:
      type: object
      description: Restore a saved setup. Give the passphrase or the recovery key.
      properties:
        passphrase:
          type:
          - string
          - 'null'
          description: The sync passphrase.
        recovery_key:
          type:
          - string
          - 'null'
          description: The recovery key shown at setup.
        version:
          type:
          - integer
          - 'null'
          format: int64
          description: An older copy; the newest when absent.
      additionalProperties: false
    Restored:
      type: object
      description: The setup was restored on this install.
      required:
      - version
      - at
      - profile
      properties:
        at:
          type: string
          description: When it was pushed.
        profile:
          $ref: '#/components/schemas/SetupProfile'
          description: The setup now on this install.
        version:
          type: integer
          format: int64
          description: The copy used.
    RoleInfo:
      type: object
      description: One role a person holds.
      required:
      - org
      - role
      - scope_kind
      - scope_id
      properties:
        org:
          type: string
          description: '`org_…`.'
        role:
          type: string
          description: Role name.
        scope_id:
          type: string
          description: The scope's id.
        scope_kind:
          type: string
          description: '`org`, `workspace` or `project`.'
    Run:
      type: object
      description: A run, as the API shows it. `state` mirrors its job.
      required:
      - id
      - project_id
      - experiment_id
      - job_id
      - name
      - kind
      - algorithm_id
      - base_model_version_id
      - state
      - created_by
      - created_at
      properties:
        algorithm_id:
          type: string
          description: The method, like `sft`.
        base_model_version_id:
          type: string
          description: '`mv_…`.'
        created_at:
          type: string
          format: date-time
          description: Created.
        created_by:
          type: string
          description: Submitter's principal id.
        engine_version_id:
          type:
          - string
          - 'null'
          description: The engine version picked by validation, once engines are registered.
        experiment_id:
          type: string
          description: '`exp_…`.'
        failure_class:
          type:
          - string
          - 'null'
          description: Failure class of the last failure.
        final_checkpoint_id:
          type:
          - string
          - 'null'
          description: Final checkpoint, `ckpt_…`.
        id:
          type: string
          description: '`run_…`.'
        job_id:
          type: string
          description: The run's job, `job_…`.
        kind:
          type: string
          description: '`TRAIN` or `EVAL`.'
        latest_committed_checkpoint_id:
          type:
          - string
          - 'null'
          description: Latest committed checkpoint, `ckpt_…`.
        name:
          type: string
          description: Name.
        parent_checkpoint_id:
          type:
          - string
          - 'null'
          description: '`ckpt_…` this run starts from.'
        parent_run_id:
          type:
          - string
          - 'null'
          description: '`run_…` this run branches from.'
        project_id:
          type: string
          description: '`prj_…`.'
        reward_version_id:
          type:
          - string
          - 'null'
          description: '`rwdv_…`.'
        state:
          type: string
          description: 'The job''s state: `QUEUED`, `RUNNING`, `REJECTED`, ….'
        state_reason:
          type:
          - object
          - 'null'
          description: 'Why: `{code, message, problems?}`; for REJECTED, every problem with a hint.'
    RunArtifactInput:
      type: object
      description: A named input from a committed artifact.
      required:
      - artifact_id
      - path
      - name
      properties:
        artifact_id:
          type: string
          description: Artifact id (`art_…`).
        name:
          type: string
          description: Unique worker input name, also used as the staged filename.
        path:
          type: string
          description: File path as listed in the artifact manifest.
      additionalProperties: false
    RunCompareDiff:
      type: object
      description: One config setting whose value differs between the runs.
      required:
      - path
      - values
      properties:
        path:
          type: string
          description: JSON pointer into the resolved config, like `/hyperparameters/lr`.
        values:
          type: object
          description: Value per `run_…` (null where a run doesn't have it).
    RunCompareRequest:
      type: object
      description: '`POST /runs:compare` body.'
      required:
      - run_ids
      properties:
        max_points:
          type:
          - integer
          - 'null'
          format: int64
          description: Points per overlay line, 2–10000 (default 1000).
        metrics:
          type: array
          items:
            type: string
          description: |-
            Metric names to overlay (each split separately); default: the names every run has
            (at most 20).
        run_ids:
          type: array
          items:
            type: string
          description: 2–10 different `run_…` ids.
      additionalProperties: false
    RunCompareResult:
      type: object
      description: '`POST /runs:compare` answer.'
      required:
      - runs
      - config_diff
      - metrics
      properties:
        config_diff:
          type: array
          items:
            $ref: '#/components/schemas/RunCompareDiff'
          description: Only the settings that differ.
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/RunCompareSeries'
          description: Overlays.
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunCompareRun'
          description: The runs, in the order asked.
    RunCompareRun:
      type: object
      description: One compared run.
      required:
      - run_id
      - name
      - state
      properties:
        name:
          type: string
          description: Run name.
        run_id:
          type: string
          description: '`run_…`.'
        state:
          type: string
          description: Job state.
    RunCompareSeries:
      type: object
      description: One metric overlaid across runs, on one step grid.
      required:
      - name
      - split
      - runs
      properties:
        name:
          type: string
          description: Metric name.
        runs:
          type: object
          description: |-
            Points per `run_…` (runs without this metric are left out); groups start at the same
            steps for every run.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/MetricPointView'
          propertyNames:
            type: string
        split:
          type: string
          description: Split.
    RunConfig:
      type: object
      description: The immutable config snapshot of a run.
      required:
      - run_id
      - submitted
      - resolved
      - resolved_sha256
      - dataset_version_ids
      - seeds
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
          description: Created.
        dataset_version_ids:
          type: array
          items:
            type: string
          description: Dataset versions, `dsv_…`.
        resolved:
          type: object
          description: 'The config after every resolver: what the engine receives.'
        resolved_sha256:
          type: string
          description: Hex SHA-256 of `resolved` (compact JSON, sorted keys).
        run_id:
          type: string
          description: '`run_…`.'
        runtime_ref:
          type:
          - string
          - 'null'
          description: Image digest or lock hash, once pinned.
        seeds:
          type: object
          description: Random seeds.
        submitted:
          type: object
          description: What was submitted (the whole request body).
    RunKind:
      type: string
      description: Run kinds (other job kinds have no run).
      enum:
      - TRAIN
      - EVAL
    RunMetrics:
      type: object
      description: '`GET /runs/{run}/metrics`.'
      required:
      - run_id
      - series
      - resources
      properties:
        progress:
          oneOf:
          - $ref: '#/components/schemas/RunProgressView'
            description: Latest progress, if any arrived.
          - type: 'null'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceActualView'
          description: Peak resource use from `resource/…` metrics.
        run_id:
          type: string
          description: '`run_…`.'
        series:
          type: array
          items:
            $ref: '#/components/schemas/MetricSeriesView'
          description: Every series, oldest first.
    RunProgressView:
      type: object
      description: The run's latest progress report.
      required:
      - attempt_id
      - step
      - total_steps
      - epoch
      - phase
      - tokens_seen
      - eta_seconds
      - updated_at
      properties:
        attempt_id:
          type: string
          description: The attempt that sent it, `att_…`.
        epoch:
          type: number
          format: double
          description: Epoch (fractional).
        eta_seconds:
          type: number
          format: double
          description: Estimated seconds left.
        phase:
          type: string
          description: Phase, like `train` or `eval`.
        step:
          type: integer
          format: int64
          description: Global step.
        tokens_seen:
          type: integer
          format: int64
          description: Tokens seen so far.
        total_steps:
          type: integer
          format: int64
          description: Planned steps.
        updated_at:
          type: string
          format: date-time
          description: When it arrived.
    RunSubmission:
      type: object
      description: '`POST /projects/{prj}/runs` body.'
      required:
      - name
      - algorithm_id
      - base_model_version_id
      properties:
        algorithm_id:
          type: string
          description: The method, like `sft`, `dpo` or `grpo`.
        artifact_inputs:
          type: array
          items:
            $ref: '#/components/schemas/RunArtifactInput'
          description: Committed artifact files to stage before launching the run.
        base_model_version_id:
          type: string
          description: The model version to start from, `mv_…`.
        config:
          type: object
          description: The method's settings (a JSON object).
        dataset_version_ids:
          type: array
          items:
            type: string
          description: Dataset versions, `dsv_…`.
        experiment_id:
          type:
          - string
          - 'null'
          description: '`exp_…`; without it the run joins the project''s `default` experiment.'
        kind:
          $ref: '#/components/schemas/RunKind'
          description: '`TRAIN` (default) or `EVAL`.'
        max_runtime_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: Longest allowed run time in seconds.
        name:
          type: string
          description: 1–200 characters.
        parent_checkpoint_id:
          type:
          - string
          - 'null'
          description: The checkpoint this one starts from, `ckpt_…`.
        parent_run_id:
          type:
          - string
          - 'null'
          description: The run this one branches from, `run_…`.
        priority:
          type: integer
          format: int32
          description: Higher runs first, −1000 to 1000 (default 0).
        resources:
          type:
          - object
          - 'null'
          description: What the job asks the scheduler for; default one trainer with one GPU.
        retry:
          type:
          - object
          - 'null'
          description: 'Retry rules: `{auto_tune, budgets: {CLASS: n}}`.'
        reward_version_id:
          type:
          - string
          - 'null'
          description: The reward version, `rwdv_…`.
        secret_ids:
          type: array
          items:
            type: string
          description: Secrets to grant to this run as worker environment variables.
        seeds:
          type:
          - object
          - 'null'
          description: 'Random seeds; the server picks `{"global": n}` when absent.'
      additionalProperties: false
    SamplePage:
      type: object
      description: A page of samples.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SampleView'
          description: Samples, oldest batch first.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` to continue; null at the end.
    SampleView:
      type: object
      description: One generated sample.
      required:
      - batch_id
      - step
      - attempt_id
      - sample_id
      - group_id
      - prompt
      - completion
      - reward_components
      - truncated
      - completion_tokens
      - policy_version
      properties:
        attempt_id:
          type: string
          description: '`att_…`.'
        batch_id:
          type: integer
          format: int64
          description: The batch it came in.
        completion:
          type: string
          description: Generated text.
        completion_tokens:
          type: integer
          format: int32
          description: Generated tokens.
          minimum: 0
        group_id:
          type: string
          description: Group (prompts sampled together).
        policy_version:
          type: integer
          format: int64
          description: Policy version that generated it.
          minimum: 0
        prompt:
          type: string
          description: Prompt text.
        reward_components:
          type: object
          description: Reward per component.
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
        reward_total:
          type:
          - number
          - 'null'
          format: double
          description: Total reward, if scored.
        sample_id:
          type: string
          description: The worker's id for the sample.
        step:
          type: integer
          format: int64
          description: Trainer step.
        truncated:
          type: boolean
          description: True when generation hit the length limit.
    SchedulerQueue:
      type: object
      description: The queue of a pool.
      required:
      - pool_id
      - total
      - jobs
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/SchedulerQueueEntry'
          description: The jobs the caller may see, first in line first.
        pool_id:
          type: string
          description: '`pool_…`.'
        total:
          type: integer
          format: int32
          description: Jobs waiting for this pool that the caller may read.
          minimum: 0
    SchedulerQueueEntry:
      type: object
      description: One waiting job.
      required:
      - job_id
      - project_id
      - position
      - priority
      properties:
        job_id:
          type: string
          description: '`job_…`.'
        position:
          type: integer
          format: int32
          description: Position among jobs the caller can read.
          minimum: 0
        priority:
          type: integer
          format: int32
          description: Higher goes first.
        project_id:
          type: string
          description: '`prj_…`.'
        queued_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it joined the queue.
        reason:
          type:
          - string
          - 'null'
          description: Why it is still waiting, in plain words.
        reason_code:
          type:
          - string
          - 'null'
          description: The reason's code, like `MRL-QUOTA-210`.
        run_id:
          type:
          - string
          - 'null'
          description: '`run_…`, for training and evaluation jobs.'
    SecretMeta:
      type: object
      description: A secret reference. Never has the value.
      required:
      - id
      - name
      - kind
      - backend
      - allowed_uses
      - created_by
      - created_at
      - rotated_at
      properties:
        allowed_uses:
          type: array
          items:
            type: string
          description: Allowed uses.
        backend:
          type: string
          description: '`secret_store` or `env`.'
        created_at:
          type: string
          format: date-time
          description: When it was made.
        created_by:
          type: string
          description: Who made it.
        env_var:
          type:
          - string
          - 'null'
          description: The environment variable, for `env` secrets.
        id:
          type: string
          description: '`sec_…`.'
        kind:
          type: string
          description: Kind.
        name:
          type: string
          description: Name.
        project_id:
          type:
          - string
          - 'null'
          description: Project.
        rotated_at:
          type: string
          format: date-time
          description: When its value was last saved; `null` if never.
    SessionStarted:
      type: object
      description: A renderer session started; the cookie is in `Set-Cookie`.
      required:
      - csrf_token
      - expires_at
      properties:
        csrf_token:
          type: string
          description: Send as `x-csrf-token` on requests from another origin.
        expires_at:
          type: string
          format: date-time
          description: When the session ends at the latest.
    SetupDone:
      type: object
      description: Setup sync is on.
      required:
      - recovery_key
      properties:
        recovery_key:
          type: string
          description: Shown once. It opens your saved setup if you forget the passphrase.
    SetupProfile:
      type: object
      description: '`setup-profile/v1`.'
      required:
      - schema
      properties:
        machines:
          type: array
          items:
            $ref: '#/components/schemas/Machine'
          description: Connected machines.
        preferences:
          type: object
          description: App preferences.
        schema:
          type: string
          description: Always `setup-profile/v1`.
        team_memberships:
          type: array
          items:
            $ref: '#/components/schemas/TeamMembership'
          description: Teams.
        ui:
          type: object
          description: UI settings.
      additionalProperties: false
    SetupRequest:
      type: object
      description: Turn on setup sync.
      required:
      - passphrase
      properties:
        passphrase:
          type: string
          description: At least 12 characters. A forgotten passphrase (and recovery key) means the setup cannot be restored.
      additionalProperties: false
    SignInState:
      type: string
      description: Where this install's sign-in stands.
      enum:
      - not_configured
      - signed_out
      - active
      - expired
    SignedIn:
      type: object
      description: The sign-in finished.
      required:
      - user
      properties:
        token:
          oneOf:
          - $ref: '#/components/schemas/NewToken'
            description: The new token, when asked for.
          - type: 'null'
        user:
          $ref: '#/components/schemas/UserInfo'
          description: Who signed in.
    SyncStatus:
      type: object
      description: Where setup sync stands.
      required:
      - set_up
      - sign_in
      properties:
        copies:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CopyInfo'
          description: Saved copies, newest first (when signed in and online).
        copies_unavailable:
          type:
          - string
          - 'null'
          description: Why `copies` is missing.
        last_push_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last push.
        last_pushed_version:
          type:
          - integer
          - 'null'
          format: int64
          description: Version of the last push.
        last_restore_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last restore.
        set_up:
          type: boolean
          description: A sync passphrase is set on this install.
        sign_in:
          $ref: '#/components/schemas/SignInState'
          description: This install's sign-in.
    TeamMembership:
      type: object
      description: A team this person belongs to.
      required:
      - name
      - address
      properties:
        address:
          type: string
          description: Address of the team core.
        name:
          type: string
          description: Team name.
        role:
          type:
          - string
          - 'null'
          description: The person's role there.
      additionalProperties: false
    TimelineEntry:
      type: object
      description: 'One timeline entry: an outbox event of the run''s job or one of its attempts.'
      required:
      - type
      - aggregate_kind
      - aggregate_id
      - aggregate_seq
      - payload
      - at
      properties:
        aggregate_id:
          type: string
          description: '`job_…` or `att_…`.'
        aggregate_kind:
          type: string
          description: '`job` or `attempt`.'
        aggregate_seq:
          type: integer
          format: int64
          description: The aggregate's version after the change.
        at:
          type: string
          format: date-time
          description: When it happened.
        payload:
          type: object
          description: The event body (`from`, `to`, `reason`, …).
        type:
          type: string
          description: Event type, like `job.queued`.
    TokenCreated:
      type: object
      description: A new join token. The token is shown once.
      required:
      - id
      - token
      - expires_at
      - ca_sha256
      - lifecycle
      - enroll_command
      properties:
        ca_sha256:
          type: string
          description: The CA fingerprint the agent pins (also inside the token).
        enroll_command:
          type: string
          description: What to run on the machine.
        expires_at:
          type: string
          format: date-time
          description: When it stops working.
        id:
          type: string
          description: Token row id.
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
          description: The machine's lifecycle.
        token:
          type: string
          description: '`mrlj_<secret>_<CA fingerprint>`; single use.'
    TokenInfo:
      type: object
      description: A token as listed (never the token itself).
      required:
      - id
      - name
      - prefix
      - scopes
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
          description: Expiry.
        id:
          type: string
          description: '`tok_…`.'
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last use (to the minute).
        name:
          type: string
          description: Name.
        prefix:
          type: string
          description: First characters, like `mrl_pat_AbCd`.
        scopes:
          type: array
          items:
            type: string
          description: Scopes.
    Transport:
      type: object
      description: |-
        How the app reaches a machine. Only these typed settings: keys and passwords stay in the
        keychain, named by `key_ref`; free-form options are refused (unknown fields).
      required:
      - kind
      properties:
        key_ref:
          type:
          - string
          - 'null'
          description: Name of the keychain secret that holds the key (never the key itself).
        kind:
          type: string
          description: '`lan`, `ssh`, `tailscale` or `cloudflare_tunnel`.'
        port:
          type:
          - integer
          - 'null'
          format: int32
          description: Port, when not the default.
          minimum: 0
        user:
          type:
          - string
          - 'null'
          description: Login name (SSH).
      additionalProperties: false
    Upload:
      type: object
      description: An upload and its progress.
      required:
      - id
      - filename
      - size
      - sha256
      - part_size
      - part_count
      - state
      - parts_received
      - created_at
      - expires_at
      properties:
        blob_key:
          type:
          - string
          - 'null'
          description: The finished file's key (completed uploads only).
        created_at:
          type: string
          format: date-time
          description: When it was opened.
        expires_at:
          type: string
          format: date-time
          description: An open upload expires at this time.
        filename:
          type: string
          description: File name.
        id:
          type: string
          description: '`up_…`.'
        part_count:
          type: integer
          format: int64
          description: Number of parts.
          minimum: 0
        part_size:
          type: integer
          format: int64
          description: Bytes per part.
          minimum: 0
        parts_received:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: Parts already stored (open uploads only).
        project_id:
          type:
          - string
          - 'null'
          description: Project.
        sha256:
          type: string
          description: Expected sha256.
        size:
          type: integer
          format: int64
          description: Total size in bytes.
          minimum: 0
        state:
          type: string
          description: '`OPEN`, `COMPLETED`, `ABORTED` or `EXPIRED`.'
    UserInfo:
      type: object
      description: A person.
      required:
      - id
      - display_name
      properties:
        avatar_url:
          type:
          - string
          - 'null'
          description: Avatar.
        display_name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email.
        id:
          type: string
          description: '`usr_…`.'
    Workspace:
      type: object
      description: A workspace.
      required:
      - id
      - org_id
      - slug
      - name
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
          description: Created.
        id:
          type: string
          description: '`ws_…`.'
        name:
          type: string
          description: Name.
        org_id:
          type: string
          description: '`org_…`.'
        slug:
          type: string
          description: Slug, unique in the org.
tags:
- name: health
  description: Liveness and readiness.
- name: tenancy
  description: Orgs, workspaces and projects.
- name: audit
  description: The audit log.
- name: auth
  description: Sign-in, access tokens and sessions.
- name: sync
  description: Encrypted setup sync.
- name: runs
  description: Experiments, runs, config snapshots and timelines.
- name: jobs
  description: 'Jobs: state, cancel and priority.'
- name: compute
  description: Pools, machines and their GPUs.
- name: artifacts
  description: Generic artifacts and the transfer endpoint.
- name: uploads
  description: Resumable uploads.
- name: lineage
  description: Where entities came from and what came from them.
- name: secrets
  description: Secret references. Values are write-only.
- name: telemetry
  description: Metric history, logs, samples and run comparison.
- name: streams
  description: Live server-sent event streams.
- name: alerts
  description: 'Alerts: list, acknowledge and resolve.'
- name: checkpoints
  description: 'Checkpoints: listing, verification and deletion.'
- name: engines
  description: Training engines, their methods and what can run where.
- name: models
  description: Models and immutable model versions.
