name: ci-guidance

on:
  pull_request:
    paths:
      - "guidance/**"
      - ".github/workflows/ci-guidance.yml"
  push:
    branches: [main]
    paths:
      - "guidance/**"
      - ".github/workflows/ci-guidance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guidance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.5"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Build check (schemas, style rules, outputs up to date)
        run: uv run --script guidance/tools/build.py --check
      - name: JS loader tests
        run: node --test guidance/tests
      - name: Python loader and build tests
        run: python3 -m unittest discover guidance/tests
      - name: Rust loader tests
        run: |
          rustc --edition 2021 --test guidance/tests/catalog_test.rs -o "$RUNNER_TEMP/guidance_rs_test"
          "$RUNNER_TEMP/guidance_rs_test"
