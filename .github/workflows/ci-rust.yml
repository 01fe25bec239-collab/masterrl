name: ci-rust

# Linux runs on every PR. macOS and Windows cost extra minutes while the repo is private,
# so they run only on pushes to main and on manual runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads rust-toolchain.toml; also sets up the cargo cache.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.20.2

      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo nextest run --workspace --locked

      - name: deny (licenses, advisories, sources)
        if: runner.os == 'Linux'
        run: cargo deny --locked check

      - name: dependency rules
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deps() { cargo tree --locked -p "$1" -e normal,build --target all --prefix none --format '{p}' | cut -d' ' -f1 | sort -u; }
          fail=0
          domain=$(deps mrl-domain)
          for bad in tokio sqlx tonic hyper axum mio reqwest; do
            if grep -qx "$bad" <<<"$domain"; then
              echo "::error::mrl-domain must stay free of IO, but it depends on '$bad'."
              fail=1
            fi
          done
          agent_direct=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mrl-agent") | .dependencies[].name')
          if grep -qx mrl-server <<<"$(deps mrl-agent)"$'\n'"$agent_direct"; then
            echo "::error::mrl-agent must not depend on mrl-server (only on mrl-domain and mrl-proto)."
            fail=1
          fi
          exit "$fail"

      - name: release build
        run: cargo build --workspace --release --locked

      # Type-checks the targets this runner does not build itself (the desktop app ships all of them).
      - name: cross-target check
        if: runner.os == 'Linux'
        run: |
          targets="aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc"
          rustup target add $targets
          cargo check --workspace --all-targets --locked $(printf -- '--target %s ' $targets)
