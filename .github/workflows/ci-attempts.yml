name: ci-attempts

# The agent attempt runtime on real Linux: FakeEngine attempts through the real mrl-worker
# harness (full lifecycle with ticket uploads, killed worker, re-adoption after an agent
# restart, janitor cleanup, environment cache hit/miss, GPU OOM class, tampered lock hash).
# MRL_TEST_ATTEMPTS_REQUIRED=1 turns a missing uv into a failure instead of a skip.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-attempts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  UV_VERSION: "0.11.28"

jobs:
  lifecycle:
    name: agent (attempt lifecycle)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: attempt lifecycle tests
        env:
          MRL_TEST_ATTEMPTS_REQUIRED: "1"
        run: cargo test -p mrl-agent --locked --test attempts -- --include-ignored

      - name: worker protocol tests (Rust client)
        run: cargo test -p mrl-testkit --locked agent::attempts
