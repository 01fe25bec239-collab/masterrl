name: ci-scheduler

# P21 scheduler end to end against PostgreSQL: placement and launch over the real gateway with
# scripted agents, killed worker → retry from the latest checkpoint, partition past the lease →
# LOST → fenced → rescheduled → stale attempt cancelled on reconnect, server and agent restarts,
# control-plane gap, cancel/pause delivery, queue reasons, one_holder_per_gpu, deployment holds.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-scheduler-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  scheduler:
    name: scheduler (postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://mrl:mrl-dev-only@127.0.0.1:55432/masterrl
      MRL_TEST_ATTEMPTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: start PostgreSQL
        run: docker compose -f deploy/local/compose.yaml up -d --wait postgres

      - name: P21 integration tests
        run: cargo test -p mrl-testkit --locked p21_scheduler -- --ignored --test-threads 4

      - name: service logs
        if: failure()
        run: docker compose -f deploy/local/compose.yaml logs postgres
