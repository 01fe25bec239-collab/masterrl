name: ci-contracts

# Protos, JSON Schemas, generated code and golden round-trips. Linux only.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUF_VERSION: "1.75.0"
  BUF_SHA256: "fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b" # buf-Linux-x86_64
  UV_VERSION: "0.11.28"
  UV_PYTHON: "3.12"
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking reads the base commit from .git

      - name: install buf
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: buf lint
        run: buf lint proto

      - name: buf breaking
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}:proto/buf.yaml" 2>/dev/null; then
            echo "skipped: the base commit has no protos yet"
            exit 0
          fi
          buf breaking proto --against ".git#ref=${BASE},subdir=proto"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # Reads rust-toolchain.toml; also sets up the cargo cache.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0,cargo-nextest@0.9.152

      - name: generated code is current
        run: |
          set -euo pipefail
          just gen
          git add -N .
          git diff --exit-code || { echo "::error::Generated files are out of date. Run 'just gen' and commit."; exit 1; }

      - name: JSON Schemas and examples
        run: uv run --script tests/contracts/check_schemas.py

      - name: golden round-trip (Python)
        run: |
          uv sync --locked
          uv run --locked pytest tests/contracts

      - name: golden round-trip (Rust)
        run: cargo nextest run -p mrl-proto --locked
