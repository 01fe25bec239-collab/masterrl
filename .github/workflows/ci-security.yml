name: ci-security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          # Only the history of the commit under test, not other branches.
          ./gitleaks git --config .gitleaks.toml --redact --verbose --log-opts=HEAD .

      - name: cargo-deny
        if: hashFiles('Cargo.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      - name: Set up Node
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: pnpm audit
        if: hashFiles('pnpm-lock.yaml') != ''
        run: |
          npm install --global pnpm@11.22.0
          pnpm audit --audit-level high

      - name: Set up uv
        if: hashFiles('uv.lock') != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.28
      - name: pip-audit
        if: hashFiles('uv.lock') != ''
        run: |
          uv export --quiet --frozen --all-packages --all-groups --no-emit-workspace --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
