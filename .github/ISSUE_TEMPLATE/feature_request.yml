name: Feature request
description: Suggest something MasterRL should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or goal, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
