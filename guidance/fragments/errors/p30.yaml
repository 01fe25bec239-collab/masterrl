# P30 desktop app: first run, this computer, backups and updates (mrl-server `desktop` module).
errors:
  - code: MRL-STATE-300
    title: These settings belong to the desktop app, not a team server.
    why: First-run steps, backups, the computer check and app updates are part of the desktop app on your own computer. A team server keeps its own settings.
    what_to_do:
      steps:
        - Open the MasterRL desktop app on your computer to change these.
        - Ask whoever runs the team server about its backups and updates.

  - code: MRL-ENV-300
    title: Backups need the database the app runs itself.
    why: This app uses a database it doesn't run itself, like a development database. It can't back that one up here.
    what_to_do:
      steps:
        - Back up that database with its own tools.
        - Remove `database.url` from the settings file to let the app run its own database.

  - code: MRL-RES-300
    title: There is no backup with this name.
    why: The backup was removed, or the list was out of date. The app keeps only the newest backups and removes older ones.
    what_to_do:
      steps:
        - Refresh the list of backups.
        - Pick one of the backups shown, then try again.

  - code: MRL-INTERNAL-300
    title: The backup or restore didn't finish.
    why: The database tools stopped with an error, or the disk is full or can't be written. Your current data is unchanged unless the message says the restore failed part way.
    what_to_do:
      steps:
        - Check that the disk with the app's data has free space.
        - Try again.
        - If a restore failed part way, restore the "before-restore" backup the app made just before.

  - code: MRL-ENV-301
    title: The computer check couldn't read the agent's settings.
    why: The settings file of this computer's agent can't be read or has a mistake in it.
    what_to_do:
      steps:
        - Open the file named in the message and fix the line it points to.
        - Or remove the file to use the defaults.
        - Then run the check again.
      macos:
        - The file is usually `~/Library/Application Support/MasterRL/agent.toml`.
      linux:
        - The file is usually `~/.config/masterrl/agent.toml`.
      windows:
        - The file is usually `%APPDATA%\MasterRL\agent.toml`.

  - code: MRL-CONFLICT-300
    title: Another backup, restore or update check is running.
    why: The app does one of these at a time, so they don't get in each other's way.
    what_to_do:
      steps:
        - Wait until the other one finishes, then try again.

  - code: MRL-ENV-302
    title: The app is reconnecting to its core.
    why: The app's core service stopped or isn't answering, so the app is starting it again. Training on your machines keeps running.
    what_to_do:
      steps:
        - Wait a moment; the app reconnects on its own.
        - If it keeps failing, choose Try again, or restart the app.
        - If it still fails, open Settings, then Privacy, and share the newest crash report.
