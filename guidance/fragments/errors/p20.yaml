# P20 agent attempt runtime errors (crates/mrl-agent: attempts, envs, worker_server, janitor).
# The runtime also reuses MRL-ENV-004 (disk full), MRL-ENV-011 (uv missing),
# MRL-ENV-012 (Docker missing), MRL-ENV-130 (protocol versions) and the MRL-STORE transfer codes.
errors:
  - code: MRL-VAL-200
    title: The training attempt has settings the agent can't use.
    why: A name, path or runtime in the attempt is missing or has the wrong form. Details names the setting.
    what_to_do:
      steps:
        - Start the run again from the app, so it sends complete settings.
        - If you wrote the attempt file yourself, fix the setting named in Details.

  - code: MRL-ENV-201
    title: The training environment's lock file doesn't match its fingerprint.
    why: The file that lists the exact package versions changed after the engine was installed. The agent won't install a changed list.
    what_to_do:
      steps:
        - Install the engine again from the app, so its files match.
        - If you changed the lock file on purpose, register it as a new engine version.

  - code: MRL-ENV-202
    title: The training environment could not be installed.
    why: Installing the engine's packages or pulling its container image failed. The network may be down, or the disk may be full.
    what_to_do:
      steps:
        - Check that this machine is online and has free disk space.
        - Read the last installer lines in Details, then start the run again.

  - code: MRL-NODE-203
    title: The agent could not open the connection to the training worker.
    why: The agent talks to the training worker through a local socket file. It could not create that file.
    what_to_do:
      steps:
        - Make sure your account can write to the agent's state folder.
        - Free up disk space, then start the run again.

  - code: MRL-STATE-204
    title: This training attempt can't do that right now.
    why: The attempt isn't running on this machine, already exists, or is in a step that doesn't allow the action. Details says which.
    what_to_do:
      steps:
        - Wait for the attempt's current step to finish, then try again.
        - If the run moved to another machine, act on it there.

  - code: MRL-VAL-205
    title: A file path in the training attempt points outside its folder.
    why: Every input and output must stay inside the attempt's own folder. A path with `..` or a full path breaks that rule.
    what_to_do:
      steps:
        - Use a path inside the attempt folder, like `data/train.jsonl`.
        - If the app sent the path, report it as a problem with the app.

  - code: MRL-NODE-206
    title: This machine is not taking new training runs right now.
    why: Someone asked the machine to finish its current work and take nothing new, for example before an update.
    what_to_do:
      steps:
        - Wait until the machine is back in service, or pick another machine.
