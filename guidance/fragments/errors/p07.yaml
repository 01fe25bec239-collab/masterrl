# P07 server runtime: startup, settings and request errors.
errors:
  # ---------- Settings ----------
  - code: MRL-CFG-001
    title: The server could not open its settings file.
    why: The file is missing, or the server is not allowed to read it.
    what_to_do:
      steps:
        - Check the path you passed with `--config`.
        - Make sure the file exists and your account can read it.

  - code: MRL-CFG-002
    title: The server could not understand its settings file.
    why: The file has a typing mistake or a setting name the server does not know.
    what_to_do:
      steps:
        - Look at the line and setting named in Details.
        - Fix the spelling, or remove the setting, then start the server again.

  - code: MRL-CFG-003
    title: A server setting has a value it cannot use.
    why: The value is outside the allowed range or does not fit with another setting.
    what_to_do:
      steps:
        - Read the setting name and allowed values in Details.
        - Change the value in the settings file, then start the server again.

  - code: MRL-CFG-004
    title: A server setting from the environment could not be used.
    why: A variable that starts with `MRL_` names a setting the server does not know.
    what_to_do:
      steps:
        - Check the variable name in Details.
        - Use the form `MRL_SECTION__KEY`, with two underscores between parts.
        - Remove the variable if you did not mean to set it.

  # ---------- Startup and shutdown ----------
  - code: MRL-SRV-001
    title: The server could not start because a required part is missing.
    why: This mode needs a part, such as sign-in, that this build does not include.
    what_to_do:
      steps:
        - Read which part is missing in Details.
        - Start the server in `solo` mode, or install the version that includes that part.

  - code: MRL-SRV-002
    title: Team mode could not start because no sign-in provider is set up.
    why: In team mode, people sign in through a provider. This build has no provider yet.
    what_to_do:
      steps:
        - Start the server with `--mode solo` to use it on this computer only.
        - Use a version with team sign-in when you need team mode.

  - code: MRL-SRV-003
    title: The server could not open a network port.
    why: Another program may use the port already, or the address is not on this computer.
    what_to_do:
      steps:
        - Read the address in Details.
        - Close the other program, or pick a free port in the settings file.
      linux:
        - Run `ss -ltnp` to see which program uses the port.
      macos:
        - Run `lsof -nP -iTCP -sTCP:LISTEN` to see which program uses the port.
      windows:
        - Run `netstat -ano` to see which program uses the port.

  - code: MRL-SRV-004
    title: The server stopped during startup.
    why: One of its startup steps, like preparing the database, did not finish.
    what_to_do:
      steps:
        - Read which step stopped in Details.
        - Fix the cause shown there, then start the server again.

  - code: MRL-SRV-005
    title: The server could not set up trace export.
    why: The trace collector address in the settings file is not one the server can use.
    what_to_do:
      steps:
        - Check `telemetry.otlp_endpoint` in the settings file.
        - Remove that setting to run without trace export.

  - code: MRL-SRV-006
    title: The server took too long to stop.
    why: Some work was still running when the shutdown time ran out.
    what_to_do:
      steps:
        - Start the server again. Unfinished work resumes where the app supports it.
        - If this keeps happening, raise `server.shutdown_grace_seconds`.

  - code: MRL-SRV-007
    title: A background job in the server stopped, so the server shut down.
    why: The job hit a problem it could not recover from.
    what_to_do:
      steps:
        - Read which job stopped in Details.
        - Start the server again. If it happens again, report it with the diagnostics.

  # ---------- Requests ----------
  - code: MRL-AUTH-001
    title: The request was not signed in.
    why: It had no sign-in details, or the details did not match.
    what_to_do:
      steps:
        - Sign in again, then repeat the action.
        - If you use the desktop app, restart it.

  - code: MRL-PERM-001
    title: Your account cannot do this.
    why: Your role in this project does not include this action.
    what_to_do:
      steps:
        - Ask a project owner to give your account a role with this action.

  - code: MRL-RES-001
    title: The item you asked for could not be found.
    why: It may have been deleted, or the link may point to the wrong item.
    what_to_do:
      steps:
        - Go back to the list and open the item again.

  - code: MRL-VAL-004
    title: Some values in the request need a change.
    why: The fields listed in Details have values the server does not accept.
    what_to_do:
      steps:
        - Fix each listed field, following its hint.
        - Send the request again.

  - code: MRL-VAL-005
    title: The page settings in the request could not be used.
    why: The page size must be between 1 and 200. The page marker must come from an earlier response.
    what_to_do:
      steps:
        - Use a `limit` from 1 to 200.
        - Use the `next_cursor` value from the previous page, without changes.

  - code: MRL-VAL-006
    title: The filter in the request could not be used.
    why: It has a typing mistake, or it names a field this list cannot filter on.
    what_to_do:
      steps:
        - Read the position and the allowed fields in Details.
        - Use the form `state in (RUNNING,QUEUED) and algorithm_id = "sft"`.

  - code: MRL-VAL-007
    title: The request is too large.
    why: Request bodies can be at most 2 MiB.
    what_to_do:
      steps:
        - Send large files through an upload instead.

  - code: MRL-CONFLICT-001
    title: Someone changed this item after you opened it.
    why: The version you edited is older than the saved one.
    what_to_do:
      steps:
        - Reload the item to see the latest version.
        - Make your change again, then save.

  - code: MRL-CONFLICT-002
    title: This change needs the version of the item you edited.
    why: The server only saves changes made to the latest version, so it needs that version tag.
    what_to_do:
      steps:
        - Load the item, then send its `ETag` value in the `If-Match` header.

  - code: MRL-IDEM-003
    title: The request key could not be used.
    why: The `Idempotency-Key` header must be 1 to 255 visible characters.
    what_to_do:
      steps:
        - Send a shorter key, such as a random one made for this request.

  - code: MRL-QUOTA-001
    title: Too many requests came in at once.
    why: The server limits how fast each account and team can send requests.
    what_to_do:
      steps:
        - Wait the number of seconds in the `Retry-After` header, then try again.

  - code: MRL-ROUTE-001
    title: There is nothing at this address.
    why: The server has no endpoint at this path.
    what_to_do:
      steps:
        - Check the path against the reference at `/api-docs/openapi.json`.

  - code: MRL-ROUTE-002
    title: This address does not support that action.
    why: The endpoint exists, but not for this request method.
    what_to_do:
      steps:
        - Check which methods the endpoint takes in the reference at `/api-docs/openapi.json`.

  - code: MRL-INTERNAL-001
    title: The server hit a problem it did not expect.
    why: Something inside the server went wrong while handling the request.
    what_to_do:
      steps:
        - Try the action again.
        - If it keeps happening, report it with the trace number from Details.

  - code: MRL-INTERNAL-002
    title: A service the server needs is not answering.
    why: A store or service behind the server failed or took too long.
    what_to_do:
      steps:
        - Wait a moment, then try again.
        - If it keeps happening, check that the server's database and storage are running.
