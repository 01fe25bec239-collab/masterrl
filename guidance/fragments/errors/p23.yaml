# P23 checkpoints: commit, verification and deletion.
errors:
  - code: MRL-STATE-230
    title: This checkpoint isn't committed, so it can't be used yet.
    why: A checkpoint can be checked, promoted or deleted only once all its files are saved and confirmed. This one is still being saved, or it was found to be damaged or deleted.
    what_to_do:
      steps:
        - Refresh to see the checkpoint's state.
        - If it is still being saved, wait a moment and try again.
        - If it is damaged, use an earlier checkpoint of the same run.

  - code: MRL-CONFLICT-230
    title: This checkpoint is still in use, so it can't be deleted.
    why: It is the run's final result or its resume point, or another run starts from it. Deleting it would break that.
    what_to_do:
      steps:
        - Wait until the run has finished, or delete the run that starts from it first.
        - The final checkpoint of a run stays as long as the run.
