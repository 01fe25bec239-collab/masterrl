# P16 identity, sign-in and setup sync errors (mrl-server: auth, sync, keychain; mrl CLI).
errors:
  - code: MRL-AUTH-160
    title: Your sign-in has expired.
    why: The sign-in service no longer accepts this computer's session. Your local work keeps running; only setup sync and teams need a fresh sign-in.
    what_to_do:
      steps:
        - Sign in again from Settings, or run `mrl login`.
        - Then repeat what you were doing, like `mrl sync push`.

  - code: MRL-AUTH-161
    title: The sign-in did not finish.
    why: The sign-in took longer than 10 minutes, was used twice, or the sign-in service refused it.
    what_to_do:
      steps:
        - Start the sign-in again and finish it in the browser within 10 minutes.
        - If it keeps failing, close other sign-in tabs and try once more.

  - code: MRL-AUTH-162
    title: Sign-in isn't set up in this app.
    why: This app has no address for the sign-in service. Local work does not need it.
    what_to_do:
      steps:
        - Keep working offline, or ask whoever runs this app to set `auth.supabase_url` and `auth.supabase_anon_key`.

  - code: MRL-AUTH-163
    title: This app is signed in to a different account.
    why: One computer links to one account at a time. Another account is signed in right now.
    what_to_do:
      steps:
        - Sign out first with `mrl logout` or in Settings.
        - Then sign in with the account you want.

  - code: MRL-LINK-160
    title: The app could not reach the sign-in service.
    why: This computer is offline, or the sign-in service did not answer. Local work keeps running.
    what_to_do:
      steps:
        - Check your internet connection, then try again.
        - Your setup stays on this computer until you can sync it.

  - code: MRL-VAL-160
    title: This passphrase or recovery key doesn't open your saved setup.
    why: The saved setup is locked with your sync passphrase. The app can't read it with a different one.
    what_to_do:
      steps:
        - Check for typing mistakes and the right letter case.
        - Use the recovery key you saved when you turned on sync.
        - Without either one, nobody can open the saved setup. Set up this computer again by hand.

  - code: MRL-STATE-160
    title: Setup sync isn't turned on yet.
    why: Sync needs a passphrase first. The app locks your setup with it before it leaves this computer.
    what_to_do:
      steps:
        - Run `mrl sync setup` or turn on sync in Settings.
        - Save the recovery key it shows in a safe place.

  - code: MRL-RES-160
    title: There is no saved setup to restore.
    why: This account has no saved setup yet, or not the copy you asked for.
    what_to_do:
      steps:
        - Run `mrl sync status` to see the saved copies.
        - On the computer that has your setup, run `mrl sync push` first.

  - code: MRL-ENV-160
    title: This computer has no keychain service.
    why: The app keeps secrets in your system keychain. This computer has none running, so secrets go to an encrypted file instead.
    what_to_do:
      steps:
        - You can keep working. Anyone who can read the app's data folder could read these secrets.
      linux:
        - Install and start a Secret Service keyring, like the `gnome-keyring` package, then restart the app.

  - code: MRL-ENV-161
    title: The app could not use this computer's keychain.
    why: The keychain is locked, or it refused the app access.
    what_to_do:
      steps:
        - Unlock your keychain, then try again.
      macos:
        - Open Keychain Access and allow MasterRL when it asks.
      windows:
        - Open Credential Manager and check that it works.
      linux:
        - Unlock your login keyring, for example with the `seahorse` app.

  - code: MRL-ENV-162
    title: The keychain request was cancelled.
    why: The keychain asked to let MasterRL use its secrets, and that request was cancelled.
    what_to_do:
      steps:
        - Start the app again and choose Allow (or Always Allow) when the keychain asks.
        - On a development machine, set `backend = "file"` under `[keychain]` in the settings file. Secrets then stay in an encrypted file.
        - Secrets do not move between the two places, so sign in again after the change.

  - code: MRL-CONFLICT-160
    title: This short name is already used here.
    why: Each org, workspace and project needs its own short name for addresses. Another one at this level already uses it.
    what_to_do:
      steps:
        - Pick a different short name, like `vision-lab-2`.
        - To use the existing one instead, find it in the list at this level.
