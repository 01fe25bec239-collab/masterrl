# What each task needs per platform. Download sizes are estimates in GB.
# Model and dataset downloads are extra and depend on what you pick.
platforms:
  - id: linux-nvidia
    name: Linux with an NVIDIA GPU
    support: full
    summary: Every task runs here.
  - id: windows-wsl2-nvidia
    name: Windows with an NVIDIA GPU
    support: wsl2-only
    summary: Training runs inside WSL2. The app does not train on Windows directly.
  - id: macos-apple-silicon
    name: Mac with Apple Silicon
    support: partial
    summary: >-
      Teach-by-example training runs with MLX.
      Reinforcement learning runs on a connected NVIDIA machine.
  - id: cpu
    name: Computer without a supported GPU
    support: tiny-models
    summary: Only tiny models train here, which is enough to learn the basics.

components:
  - id: nvidia-driver
    name: NVIDIA driver
    summary: Lets programs use your NVIDIA GPU.
    download_gb:
      linux-nvidia: { min: 0.3, max: 0.5 }
      windows-wsl2-nvidia: { min: 0.6, max: 0.9 }
    estimated: true
  - id: cuda
    name: CUDA
    summary: NVIDIA's libraries that run math on the GPU.
    download_gb:
      linux-nvidia: { min: 2.5, max: 4 }
      windows-wsl2-nvidia: { min: 2.5, max: 4 }
    estimated: true
  - id: wsl2
    name: WSL2
    summary: A Linux system that runs inside Windows, where training happens.
    download_gb:
      windows-wsl2-nvidia: { min: 0.5, max: 1.5 }
    estimated: true
  - id: python-env
    name: Python environment
    summary: Python and uv, which install and run the training tools.
    download_gb:
      linux-nvidia: { min: 0.03, max: 0.08 }
      windows-wsl2-nvidia: { min: 0.03, max: 0.08 }
      macos-apple-silicon: { min: 0.03, max: 0.08 }
      cpu: { min: 0.03, max: 0.08 }
    estimated: true
  - id: pytorch
    name: PyTorch
    summary: The main library for training models.
    download_gb:
      linux-nvidia: { min: 1, max: 2.5 }
      windows-wsl2-nvidia: { min: 1, max: 2.5 }
      cpu: { min: 0.2, max: 0.4 }
    estimated: true
  - id: trl
    name: TRL
    summary: The training engine for fine-tuning and preference methods, with its helper libraries.
    download_gb:
      linux-nvidia: { min: 0.1, max: 0.3 }
      windows-wsl2-nvidia: { min: 0.1, max: 0.3 }
      cpu: { min: 0.1, max: 0.3 }
    estimated: true
  - id: vllm
    name: vLLM
    summary: A fast engine that writes answers during reinforcement learning and in the Playground.
    download_gb:
      linux-nvidia: { min: 0.5, max: 1.5 }
      windows-wsl2-nvidia: { min: 0.5, max: 1.5 }
    estimated: true
  - id: mlx
    name: MLX
    summary: Apple's library for training and running models on a Mac.
    download_gb:
      macos-apple-silicon: { min: 0.05, max: 0.2 }
    estimated: true

requirements:
  # Linux with NVIDIA: full support.
  - { task: sft-lora, platform: linux-nvidia, supported: true, components: [nvidia-driver, cuda, python-env, pytorch, trl] }
  - { task: sft-qlora, platform: linux-nvidia, supported: true, components: [nvidia-driver, cuda, python-env, pytorch, trl] }
  - { task: sft-full, platform: linux-nvidia, supported: true, components: [nvidia-driver, cuda, python-env, pytorch, trl] }
  - { task: dpo, platform: linux-nvidia, supported: true, components: [nvidia-driver, cuda, python-env, pytorch, trl] }
  - { task: grpo, platform: linux-nvidia, supported: true, components: [nvidia-driver, cuda, python-env, pytorch, trl, vllm] }
  - { task: distillation, platform: linux-nvidia, supported: true, components: [nvidia-driver, cuda, python-env, pytorch, trl] }
  - { task: playground, platform: linux-nvidia, supported: true, components: [nvidia-driver, cuda, python-env, pytorch, vllm] }
  - { task: mlx-sft, platform: linux-nvidia, supported: false, note: "MLX runs only on Apple Silicon Macs. Use sft-lora here instead." }

  # Windows with NVIDIA: training runs inside WSL2.
  - { task: sft-lora, platform: windows-wsl2-nvidia, supported: true, components: [nvidia-driver, wsl2, cuda, python-env, pytorch, trl], note: "Runs inside WSL2." }
  - { task: sft-qlora, platform: windows-wsl2-nvidia, supported: true, components: [nvidia-driver, wsl2, cuda, python-env, pytorch, trl], note: "Runs inside WSL2." }
  - { task: sft-full, platform: windows-wsl2-nvidia, supported: true, components: [nvidia-driver, wsl2, cuda, python-env, pytorch, trl], note: "Runs inside WSL2." }
  - { task: dpo, platform: windows-wsl2-nvidia, supported: true, components: [nvidia-driver, wsl2, cuda, python-env, pytorch, trl], note: "Runs inside WSL2." }
  - { task: grpo, platform: windows-wsl2-nvidia, supported: true, components: [nvidia-driver, wsl2, cuda, python-env, pytorch, trl, vllm], note: "Runs inside WSL2." }
  - { task: distillation, platform: windows-wsl2-nvidia, supported: true, components: [nvidia-driver, wsl2, cuda, python-env, pytorch, trl], note: "Runs inside WSL2." }
  - { task: playground, platform: windows-wsl2-nvidia, supported: true, components: [nvidia-driver, wsl2, cuda, python-env, pytorch, vllm], note: "Runs inside WSL2." }
  - { task: mlx-sft, platform: windows-wsl2-nvidia, supported: false, note: "MLX runs only on Apple Silicon Macs. Use sft-lora here instead." }

  # Mac with Apple Silicon: MLX for teach-by-example; no NVIDIA.
  - { task: sft-lora, platform: macos-apple-silicon, supported: true, components: [python-env, mlx], note: "Runs with MLX." }
  - { task: sft-qlora, platform: macos-apple-silicon, supported: true, components: [python-env, mlx], note: "Runs with MLX on a 4-bit model." }
  - { task: sft-full, platform: macos-apple-silicon, supported: true, components: [python-env, mlx], note: "Runs with MLX." }
  - { task: mlx-sft, platform: macos-apple-silicon, supported: true, components: [python-env, mlx] }
  - { task: playground, platform: macos-apple-silicon, supported: true, components: [python-env, mlx], note: "Runs with MLX." }
  - { task: dpo, platform: macos-apple-silicon, supported: false, note: "DPO is not offered on a Mac. Run it on a connected NVIDIA machine." }
  - { task: grpo, platform: macos-apple-silicon, supported: false, note: "GRPO needs vLLM, which needs NVIDIA. Run it on a connected NVIDIA machine." }
  - { task: distillation, platform: macos-apple-silicon, supported: false, note: "Distillation is not offered on a Mac. Run it on a connected NVIDIA machine." }

  # No supported GPU: tiny models only.
  - { task: sft-lora, platform: cpu, supported: true, components: [python-env, pytorch, trl], note: "Tiny models only. Training is slow." }
  - { task: sft-full, platform: cpu, supported: true, components: [python-env, pytorch, trl], note: "Tiny models only. Training is slow." }
  - { task: playground, platform: cpu, supported: true, components: [python-env, pytorch, trl], note: "Tiny models only. Answers come slowly." }
  - { task: sft-qlora, platform: cpu, supported: false, note: "QLoRA needs a GPU. Use sft-lora with a tiny model instead." }
  - { task: dpo, platform: cpu, supported: false, note: "DPO is too slow without a GPU. Run it on a connected NVIDIA machine." }
  - { task: grpo, platform: cpu, supported: false, note: "GRPO needs vLLM, which needs NVIDIA. Run it on a connected NVIDIA machine." }
  - { task: distillation, platform: cpu, supported: false, note: "Distillation is too slow without a GPU. Run it on a connected NVIDIA machine." }
  - { task: mlx-sft, platform: cpu, supported: false, note: "MLX runs only on Apple Silicon Macs. Use sft-lora here instead." }
