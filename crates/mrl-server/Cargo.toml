[package]
name = "mrl-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mrl-server"
path = "src/main.rs"

[dependencies]
async-trait = "=0.1.92"
axum = { workspace = true, features = ["http2"] }
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive"] }
git-version = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry-otlp = { workspace = true, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "=0.33.1", features = ["trace", "rt-tokio"] }
prometheus = { version = "=0.14.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = "=2.6.1"
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "serde"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
toml = "=1.2.0"
tonic = { workspace = true, features = ["router"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["compression-gzip", "limit", "catch-panic"] }
tracing = { workspace = true }
tracing-opentelemetry = "=0.34.0"
tracing-subscriber = { workspace = true, features = ["json", "env-filter", "fmt"] }
uuid = { workspace = true, features = ["v4", "v7"] }
utoipa = { workspace = true, features = ["yaml"] }

[dev-dependencies]
rcgen = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
