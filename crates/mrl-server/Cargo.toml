[package]
name = "mrl-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mrl-server"
path = "src/main.rs"

[dependencies]
async-trait = "=0.1.92"
axum = { workspace = true, features = ["http2"] }
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
git-version = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry-otlp = { workspace = true, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "=0.33.1", features = ["trace", "rt-tokio"] }
prometheus = { version = "=0.14.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = "=2.6.1"
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "serde"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "fs", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
toml = "=1.2.0"
tonic = { workspace = true, features = ["router"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["compression-gzip", "limit", "catch-panic"] }
tracing = { workspace = true }
tracing-opentelemetry = "=0.34.0"
tracing-subscriber = { workspace = true, features = ["json", "env-filter", "fmt"] }
uuid = { workspace = true, features = ["v4", "v7"] }
utoipa = { workspace = true, features = ["yaml"] }
# <mrl:deps P16> P16 dependencies go right below this line.
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
getrandom = "=0.3.4"
hmac = "=0.13.0"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
keyring = { workspace = true }
mrl-domain = { path = "../mrl-domain" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query"] }

# <mrl:deps P17> P17 dependencies go right below this line.

# <mrl:deps P18> P18 dependencies go right below this line.
chacha20poly1305 = { workspace = true }
mrl-domain = { path = "../mrl-domain" }
mrl-proto = { path = "../mrl-proto" }
prost = { workspace = true }
prost-types = "=0.14.6"
rcgen = { workspace = true, features = ["x509-parser"] }
webpki = { package = "rustls-webpki", version = "=0.103.17", default-features = false, features = ["ring", "std"] }
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio-stream = "=0.1.19"
hyper-util = { version = "=0.1.21", features = ["tokio"] }

# <mrl:deps P19> P19 dependencies go right below this line.

[dev-dependencies]
mrl-domain = { path = "../mrl-domain" }
tempfile = "=3.27.0"
rcgen = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
