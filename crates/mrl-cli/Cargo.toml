[package]
name = "mrl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mrl"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
git-version = { workspace = true }

# <mrl:deps P16> P16 dependencies go right below this line.
keyring = { workspace = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "blocking"] }
rpassword = "=7.5.5"
serde_json = { workspace = true }

# <mrl:deps P17> P17 dependencies go right below this line.

[lints]
workspace = true
