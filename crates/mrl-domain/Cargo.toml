[package]
name = "mrl-domain"
description = "Pure MasterRL domain types: IDs, state machines, failure classes, roles and error codes. No IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# `sqlx::Type` for the ID newtypes (stored as `uuid` columns). Off by default: it pulls in IO crates.
sqlx = ["dep:sqlx"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
