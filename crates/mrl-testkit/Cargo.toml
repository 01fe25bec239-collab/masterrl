[package]
name = "mrl-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "=0.1.92"
axum = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
mrl-server = { path = "../mrl-server" }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
tonic = { workspace = true, features = ["router"] }
tower = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
# <mrl:deps P11> P11 dependencies go right below this line.
sha2 = { workspace = true }
sqlx = { workspace = true }

# <mrl:deps P12> P12 dependencies go right below this line.
mrl-agent = { path = "../mrl-agent" }
tempfile = "=3.27.0"

# <mrl:deps P16> P16 dependencies go right below this line.
base64 = "=0.22.1"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
mrl-domain = { path = "../mrl-domain" }
rcgen = { workspace = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

# <mrl:deps P17> P17 dependencies go right below this line.

# <mrl:deps P18> P18 dependencies go right below this line.
mrl-proto = { path = "../mrl-proto" }
prost = { workspace = true }
prost-types = "=0.14.6"

# <mrl:deps P19> P19 dependencies go right below this line.
mrl-storage = { path = "../mrl-storage" }
object_store = { workspace = true, features = ["aws"] }

# <mrl:deps P20> P20 dependencies go right below this line.
tokio-stream = { version = "=0.1.19", features = ["net"] }
# <mrl:deps P21> P21 dependencies go right below this line.
# <mrl:deps P22> P22 dependencies go right below this line.
# <mrl:deps P23> P23 dependencies go right below this line.
# <mrl:deps P24> P24 dependencies go right below this line.

[dev-dependencies]
rcgen = { workspace = true }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
