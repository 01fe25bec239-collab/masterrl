[project]
name = "mrl-rewards"
version = "0.1.0"
description = "MasterRL reward functions"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio==1.85.1",
    "protobuf==7.36.2",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "google-re2==1.1.20251105",
]

[project.scripts]
mrl-reward-exec = "mrl_rewards.exec.main:main"
mrl-reward-sandboxed = "mrl_rewards.server_bundle.serve:main"

[dependency-groups]
dev = ["hypothesis==6.170.14"]

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"
