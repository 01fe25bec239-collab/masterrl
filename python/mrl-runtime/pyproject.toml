[project]
name = "mrl-runtime"
version = "0.1.0"
description = "MasterRL training runtime"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio==1.85.1",
    "protobuf==7.36.2",
    # <mrl:deps P13> P13 dependencies go right below this line.
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",

    # <mrl:deps P15> P15 dependencies go right below this line.
    "jinja2==3.1.6",
    "pyarrow==26.0.1",
    "tokenizers==0.23.3",
    # <mrl:deps P26> P26 dependencies go right below this line.
    "huggingface-hub==2.4.0",
    "numpy==2.5.4",
    # <mrl:deps P27> P27 dependencies go right below this line.
    # <mrl:deps P29> P29 dependencies go right below this line.
]

[project.scripts]
mrl-worker = "mrl_runtime.harness.main:main"
mrl-conformance = "mrl_runtime.testkit.cli:main"

[project.entry-points."mrl_runtime.engines"]
builtin = "mrl_runtime.builtin.engine:manifest"
fake = "mrl_runtime.testkit.fake:manifest"

[project.entry-points."mrl_runtime.conformance"]
fake = "mrl_runtime.testkit.fake:conformance_profile"

[project.entry-points."mrl_runtime.builtin_tasks"]
hash_files = "mrl_runtime.builtin.tasks:HASH_FILES"
# <mrl:builtin-tasks P26> P26 tasks go right below this line.
import_model = "mrl_runtime.builtin.import_model:IMPORT_MODEL"
merge_adapter = "mrl_runtime.builtin.merge_adapter:MERGE_ADAPTER"
export_model = "mrl_runtime.builtin.export_model:EXPORT_MODEL"
# <mrl:builtin-tasks P27> P27 tasks go right below this line.
# <mrl:builtin-tasks P29> P29 tasks go right below this line.

[dependency-groups]
dev = ["hypothesis==6.170.14"]

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"
