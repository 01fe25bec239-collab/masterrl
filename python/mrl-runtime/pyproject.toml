[project]
name = "mrl-runtime"
version = "0.1.0"
description = "MasterRL training runtime"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio==1.85.1",
    "protobuf==7.36.2",
    # <mrl:deps P13> P13 dependencies go right below this line.

    # <mrl:deps P15> P15 dependencies go right below this line.
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "pyarrow==26.0.1",
    "tokenizers==0.23.3",
    # Test-only (property tests); A1 may move it to the root dev group.
    "hypothesis==6.170.15",
]

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"
