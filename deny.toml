# cargo-deny policy: licenses, advisories, banned sources. Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# The ignores below are for pins later parts will use, so "not encountered" is expected today.
unused-ignored-advisory = "allow"
# Pinned crates with no fixed release yet. Remove each entry once upstream ships a fix.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa (via russh): Marvin timing attack, no fixed rsa release; needed for users' existing RSA SSH keys" },
    { id = "RUSTSEC-2026-0370", reason = "zbus_names (via keyring on Linux): unmaintained, merged into zbus 6; not a vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zvariant (via keyring on Linux): unmaintained, merged into zbus 6; not a vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive (via keyring on Linux): unmaintained, merged into zbus 6; not a vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list covers dependencies later parts add, so unused entries are expected.
unused-allowed-license = "allow"
# MPL-2.0 is allowed for dependencies only; project code is Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
]

# Mozilla's root certificate data (via object_store -> reqwest -> rustls-platform-verifier, wasm32 only).
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
